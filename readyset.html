<title>Readyset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; sticky header, bottom tab bar, cards only where a thing is tappable. */
:root {
  --bg: #eceef1;            /* cool steel paper */
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #d6dae0;
  --fg: #151920;
  --muted: #5f6977;
  --accent: #c2490c;        /* safety orange, like a loading pin (dark enough for white text) */
  --accent-fg: #ffffff;
  --accent-soft: #fde9dc;
  --accent-ink: #a33d08;    /* orange text on a light orange background */
  --good: #17703d; --good-soft: #dff3e6;
  --warn: #8a6400; --warn-soft: #fbf0cc;
  --bad: #c73a32;  --bad-soft: #fbe0de;
  --on-good: #ffffff; --on-bad: #ffffff;
  --field-line: #8f98a6;    /* input outlines: 3:1 against the card */
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(10, 20, 40, .06), 0 4px 14px rgba(10, 20, 40, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --line: #2b323c;
    --fg: #e9ecf0; --muted: #98a2b0; --accent: #ff7a30; --accent-fg: #14110e; --accent-soft: #3a2316;
    --good: #46c272; --good-soft: #163a25; --warn: #e5b42c; --warn-soft: #3b3012; --bad: #f0635a; --bad-soft: #43201e;
    --accent-ink: #ff7a30; --on-good: #0f1216; --on-bad: #0f1216; --field-line: #66717f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --line: #2b323c;
  --fg: #e9ecf0; --muted: #98a2b0; --accent: #ff7a30; --accent-fg: #14110e; --accent-soft: #3a2316;
  --good: #46c272; --good-soft: #163a25; --warn: #e5b42c; --warn-soft: #3b3012; --bad: #f0635a; --bad-soft: #43201e;
  --accent-ink: #ff7a30; --on-good: #0f1216; --on-bad: #0f1216; --field-line: #66717f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* Touch: no double-tap zoom on quick repeated taps, no grey tap flash (buttons press instead),
   and taps never select text or pop the iOS callout. Pinch zoom stays available. */
html { height: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
/* App shell: the page itself never scrolls. Header, content area and tab bar stack in a column
   and only the content area (#scroller) scrolls. On iOS a tap on anything inside a gliding
   scroller only stops the glide; keeping the tab bar outside it means one tap always switches. */
html, body { overflow: hidden; overscroll-behavior: none; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, .tabbar, .pill, .set .n, .timer, .seg, .chips { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* iOS zooms the page into any form control whose text is under 16px, and often stays zoomed,
   which is what makes scrolling drift sideways. No control here goes below 16px. */
input, select, textarea { font-size: max(16px, 1em); }
/* While the RPE sheet is up the content behind it must not scroll under your thumb. */
body:has(.sheet-bg) #scroller { overflow: hidden; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.display { font-family: var(--display); }

/* App frame */
/* Only the status-bar strip stays fixed at the top (the header scrolls away with the content). */
#app { height: 100%; display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
#scroller { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; display: flex; flex-direction: column; }
.topbar { flex: none; padding-top: 10px; padding-bottom: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 680px; width: 100%; margin: 0 auto; }
.topbar .brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; }
.topbar .brand span { color: var(--accent); }
.topbar .pos { font-family: var(--display); font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: right; }
/* --tabbar-h is the bar's height above the home indicator; content, the rest timer and the sheet
   all clear it plus the device's own safe area, whatever the phone. */
/* --sab: the home-indicator gap under the tab bar. The full inset (34px on Face ID iPhones) is
   far more than the thin indicator needs; keeping 12px leaves the labels just clear of it. */
:root { --tabbar-h: 56px; --gutter: 16px; --sab: max(0px, calc(env(safe-area-inset-bottom, 0px) - 22px)); }
main { flex: 1 0 auto; padding-top: 10px; padding-bottom: 28px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; max-width: 680px; width: 100%; margin: 0 auto; }
body:has(#timer) main { padding-bottom: 96px; }
/* Setup and the recovery screen hide the tab bar, so the content reaches the home indicator. */
body:has(#tabbar[hidden]) main { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
main > * { min-width: 0; }
.tabbar { flex: none; position: relative; z-index: 9; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: var(--sab); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.tabbar button { flex: 1; background: none; border: 0; height: var(--tabbar-h); padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-family: var(--display); font-size: .86rem; line-height: 1.15; text-transform: uppercase; letter-spacing: .06em; }
.tabbar button svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* Cards and sections */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.accent { background: var(--accent); color: var(--accent-fg); }
.card.accent .muted, .card.accent .tiny { color: var(--accent-fg); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
/* Paired fields keep their boxes level even when one label wraps (narrow phones, larger text). */
.grid2 > label.f, .grid3 > label.f { justify-content: flex-end; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1; }
.kpi .v small { font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger-fill { background: var(--bad); color: var(--on-bad); border-color: transparent; }
/* Small buttons keep their look but get a 44 px tall touch area. */
.btn.sm { position: relative; }
.btn.sm::after { content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: .9rem; }
.btn.icon { min-width: 44px; min-height: 36px; padding: 6px; }
.row.nowrap { flex-wrap: nowrap; flex: none; }
select.btn, select.btn.sm { font-size: 16px; max-width: 100%; }
/* File picker styled as a button: the input stays in the layout (not display:none) so iOS opens it. */
.file-pick { position: relative; overflow: hidden; cursor: pointer; }
.file-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
/* Pressed state, so every tap answers immediately. */
.btn:active, .seg button:active, .chips button:active, .rpegrid button:active, .set .rpe:active, .set .ok:active, .tabbar button:active, .ex-sum:active, .warm-sum:active, .timer button:active { opacity: .7; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }

/* Segmented choice (1-5 scales, options) */
.seg { display: grid; gap: 6px; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 4px; min-height: 48px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.seg button small { font-weight: 500; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.seg button[aria-pressed="true"] small { color: var(--accent-fg); }
.seg.plain button { font-size: .86rem; line-height: 1.15; text-align: center; padding: 8px 4px; }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); }
.q { display: flex; flex-direction: column; gap: 8px; }
.q .label { font-weight: 600; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.green { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.skipped { text-decoration: line-through; opacity: .7; border-style: dashed; }
.pill.yellow { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.red { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.green { background: var(--good); } .dot.yellow { background: var(--warn); } .dot.red { background: var(--bad); }

/* Exercise block in a session */
.ex { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ex-head { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ex-head .name { font-family: var(--display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
.ex-head .meta { font-size: .85rem; color: var(--muted); }
.ex-note { padding: 0 14px 8px; font-size: .9rem; color: var(--muted); }
.sets { display: flex; flex-direction: column; }
.set { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 60px 46px; align-items: center; gap: 6px; padding: 7px 10px 7px 12px; border-top: 1px solid var(--line); min-height: 52px; position: relative; overflow: hidden; touch-action: pan-y; }
/* Swipe to delete: the row's cells slide left by --sx and the Delete button follows them in. */
.set > *:not(.swipe-del) { transform: translateX(var(--sx, 0px)); transition: transform .18s ease; }
.set.swiping > *:not(.swipe-del) { transition: none; }
.set .swipe-del { position: absolute; top: 0; bottom: 0; right: calc(-84px - var(--sx, 0px)); width: 84px; border: 0; background: var(--bad); color: #fff; font-family: var(--display); font-weight: 700; font-size: .95rem; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; justify-content: center; transition: right .18s ease; }
.set.swiping .swipe-del { transition: none; }
.set .swipe-del:active { filter: brightness(.9); }
.set.is-warm { min-height: 46px; padding-block: 4px; }
.set.is-warm .field input { font-weight: 500; }
.set.next { box-shadow: inset 3px 0 0 var(--accent); }
.warm-sum { width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); text-align: left; min-height: 44px; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; padding: 6px 14px 6px 12px; color: inherit; }
.warm-sum .n { color: var(--good); }
/* A finished exercise folds to one line (tap to reopen), so the session gets shorter as you go. */
.ex.collapsed { box-shadow: none; border: 1px solid var(--line); }
.ex-sum { width: 100%; border: 0; background: var(--surface); color: inherit; text-align: left; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 14px; min-height: 52px; }
.ex-sum .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--good); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.ex-sum .tick svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ex-sum .sum-main { display: flex; flex-direction: column; min-width: 0; }
.ex-sum .sum-main b { font-family: var(--display); font-size: 1.1rem; line-height: 1.15; }
.ex-sum .sum-main .small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ex-sum { grid-template-columns: 28px minmax(0, 1fr) 28px; }
.ex-sum .tick { color: var(--on-good); }
.ex.collapsed.todo .tick { background: var(--surface-2); color: var(--fg); border: 2px solid var(--accent); font-family: var(--display); font-weight: 700; font-size: .95rem; }
.ex-sum .chev, .fold-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ex-sum .chev { display: inline-flex; color: var(--muted); }
.ex-tools { display: flex; align-items: center; gap: 4px; flex: none; }
.fold-btn { width: 44px; height: 44px; margin: -6px -8px 0 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.fold-btn:active { opacity: .7; background: var(--surface-2); }
.session-tools { margin: -4px 0 -2px; flex-wrap: nowrap; }
.session-tools .small { min-width: 0; }
.foot-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.set .del { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--bad); background: var(--bad-soft); color: var(--bad); display: inline-flex; align-items: center; justify-content: center; }
.set .del svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; }
.set .del:active { opacity: .7; }
/* History: name and date on the left; readiness and difficulty in fixed columns so they line up. */
.hist-row { display: grid; grid-template-columns: minmax(0, 1fr) 46px 96px; align-items: center; gap: 8px; padding: 2px 26px 2px 0; }
.hist-main { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.hist-main b { line-height: 1.2; }
.hist-ready, .hist-diff { display: flex; justify-content: center; }
.hist-row .pill { width: 100%; justify-content: center; padding: 3px 4px; font-size: .72rem; letter-spacing: .04em; white-space: nowrap; }
.set .n { font-family: var(--display); color: var(--muted); font-weight: 600; font-size: 1rem; }
.set.done { background: var(--surface-2); }
.set.done .n { color: var(--good); }
.set .field { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
.set .field input { width: 100%; max-width: 92px; border: 1px solid var(--field-line); border-radius: 6px; padding: 6px 8px; background: var(--surface); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.set .field input::-webkit-outer-spin-button, .set .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set .field { min-width: 0; }
.set .field .u { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); max-width: 100%; white-space: normal; line-height: 1.1; overflow-wrap: break-word; }
.offer-bar { align-items: center; padding-right: 6px; }
/* The planned reps sit in the field until the set is logged: readable, but lighter than a typed value. */
.set .field input::placeholder { color: var(--muted); opacity: 1; font-weight: 500; }
.set .rpe { min-height: 44px; border: 1px solid var(--field-line); border-radius: 6px; padding: 6px 4px; background: var(--surface); text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; width: 100%; }
.set .rpe.empty { color: var(--muted); font-weight: 500; }
.set .ok { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.set .ok svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.set.done .ok { background: var(--good); border-color: var(--good); color: var(--on-good); }
.set .kind { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
.ex-note.adj { color: var(--accent-ink); }
.ex-foot { padding: 8px 14px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.plates { font-size: .85rem; color: var(--muted); }
.plates b { color: var(--fg); }
.warm { padding: 6px 14px 10px; font-size: .85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.warm > summary { min-height: 44px; display: flex; align-items: center; width: 100%; }
.warm span { background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
/* A chevron says a row opens; it turns when it does. */
details > summary { position: relative; padding-right: 26px; }
details > summary::after { content: ""; position: absolute; right: 6px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform .15s ease; }
details[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }

/* RPE picker sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; overscroll-behavior: contain; touch-action: none; }
.sheet { background: var(--surface); width: 100%; max-width: 680px; border-radius: 16px 16px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 85vh; max-height: 85dvh; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }
.rpegrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rpegrid button { border: 1px solid var(--line); border-radius: 8px; padding: 10px 0; font-weight: 700; font-size: 1.1rem; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; align-items: center; }
.rpegrid button small { font-weight: 500; font-size: .72rem; color: var(--muted); text-transform: uppercase; }
.rpegrid button.target { border-color: var(--accent); }
.rpegrid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.rpegrid button[aria-pressed="true"] small { color: var(--accent-fg); }

/* Rest timer bar */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--sab) + 10px); z-index: 8; max-width: calc(100vw - 2 * var(--gutter)); white-space: nowrap; background: var(--fg); color: var(--bg); border-radius: 22px; padding: 6px 8px 6px 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); font-family: var(--display); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer .t-main { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.timer .t-sub { font-family: var(--body); font-size: .7rem; font-weight: 600; opacity: .85; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.timer .t-btns { display: flex; gap: 6px; flex: none; }
.timer button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 8px 11px; min-height: 44px; font-size: .88rem; font-family: var(--body); font-weight: 600; }

<script>
/* Readyset engine — pure training logic, no DOM.
   Loads are fractions of the Training Max (TM). TM defaults to 90% of the lifter's 1RM, so a
   "100% TM" set is a ~90% 1RM set. %1RM figures in comments assume that default.
   Sources: Israetel, Hoffmann & Smith, Scientific Principles of Strength Training (2020); page
   numbers in comments refer to that book. */
(function (root) {
  'use strict';

  // ---------- Rep-max math (reps-to-failure -> fraction of 1RM) ----------
  const RM = [0, 1.0, 0.955, 0.922, 0.892, 0.863, 0.837, 0.811, 0.786, 0.762, 0.739, 0.717, 0.694, 0.672, 0.650, 0.630];
  function pctForRTF(n) {
    if (n <= 1) return 1;
    if (n >= 15) return RM[15] * Math.pow(0.978, n - 15);
    const lo = Math.floor(n), hi = Math.ceil(n), f = n - lo;
    return RM[lo] + (RM[hi] - RM[lo]) * f;
  }
  function rtfForPct(p) {
    if (p >= 1) return 1;
    for (let n = 1; n < 40; n++) {
      const a = pctForRTF(n), b = pctForRTF(n + 1);
      if (p <= a && p >= b) return n + (a - p) / (a - b);

  }

    if (!(weight > 0) || !(reps > 0) || !(rpe >= 0)) return 0;
    const rir = Math.max(0, Math.min(6, 10 - rpe));
    return weight / pctForRTF(Math.min(reps, 30) + rir);
  }
  const MAX_EVIDENCE_REPS = 20; // a set logged with more reps than this is a typo, not evidence
  function expectedRIR(pctOf1RM, reps) { return Math.max(0, rtfForPct(pctOf1RM) - reps); }
  function plannedRPE(pctOf1RM, reps) { return Math.min(10, Math.max(5, Math.round((10 - expectedRIR(pctOf1RM, reps)) * 2) / 2)); }

  // ---------- Loading ----------
  function roundTo(x, inc) { return Math.round(x / inc) * inc; }
  function floorTo(x, inc) { return Math.floor(x / inc + 1e-9) * inc; }
  // The barbell step: one pair of the smallest plate. Totals are the bar plus whole steps, so a
  // 45 lb bar with no 2.5s gets 45, 55, 65... (never a total that leaves 2.5 per side).
  function loadStep(plates) { const ps = (plates || []).filter(p => typeof p === 'number' && p > 0); return ps.length ? 2 * Math.min(...ps) : 5; }
  // The per-side amounts (in quarter pounds, up to 1000 lb a side) a set of plates can make.

    const key = ps.join(','); if (reachMemo.has(key)) return reachMemo.get(key);
    const U = 4, max = 1000 * U, units = ps.map(p => Math.round(p * U)).filter(p => p > 0), ok = new Uint8Array(max + 1); ok[0] = 1;

  // under the bar. With a full set of small plates this is the bar plus whole pairs of the smallest.
  function barRound(x, bar, step, plates) {
    const grid = bar + Math.max(0, roundTo(x - bar, step > 0 ? step : 5));
    const ps = (plates || []).filter(p => typeof p === 'number' && p > 0);
    if (!ps.length) return grid;
    const ok = reachable(ps), U = 4, maxA = ok.length - 1, t = Math.max(0, (x - bar) / 2 * U);
    if (t >= maxA) return grid;
    let lo = Math.floor(t + 1e-9), hi = Math.ceil(t - 1e-9);

    low_bar_squat:   { name: 'Low-Bar Squat', tm: 'squat', mult: 1.0, load: 'bar', group: 'legs', muscles: ['glutes', 'hamstrings', 'quads'], cue: 'Bar on rear delts, hips back, forward lean, drive the hips up' },
    belt_squat:      { name: 'Belt Squat', tm: null, load: 'belt', group: 'legs', muscles: ['quads', 'glutes'], startHint: 'Pick a weight you could do for about 15 reps' },
    comp_bench:      { name: 'Competition Bench', tm: 'bench', mult: 1.0, load: 'bar', group: 'push', muscles: ['chest', 'triceps', 'delts'] },
    close_grip:      { name: 'Close-Grip Bench', tm: 'bench', mult: 0.90, load: 'bar', group: 'push', muscles: ['triceps', 'chest'], cue: 'Grip at least one hand-width (3-4 in) narrower than competition' },
    paused_bench:    { name: 'Long-Pause Bench', tm: 'bench', mult: 0.90, load: 'bar', group: 'push', muscles: ['chest', 'triceps'], cue: '3-count pause on the chest, stay tight' },
    spoto_press:     { name: 'Spoto Press', tm: 'bench', mult: 0.90, load: 'bar', group: 'push', muscles: ['chest', 'triceps'], cue: 'Pause 1 in off the chest for 2 s' },
    larsen_press:    { name: 'Larsen Press', tm: 'bench', mult: 0.85, load: 'bar', group: 'push', muscles: ['chest', 'triceps'], cue: 'Legs straight out, no leg drive' },
    ohp:             { name: 'Overhead Press', tm: 'bench', mult: 0.62, load: 'bar', group: 'push', muscles: ['delts', 'triceps'] },
    db_incline:      { name: 'Incline DB Press', tm: null, load: 'db', group: 'push', muscles: ['chest', 'delts', 'triceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    db_shoulder:     { name: 'Seated DB Shoulder Press', tm: null, load: 'db', group: 'push', muscles: ['delts', 'triceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    comp_deadlift:   { name: 'Competition Deadlift', tm: 'deadlift', mult: 1.0, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'] },
    paused_deadlift: { name: 'Paused Deadlift', tm: 'deadlift', mult: 0.80, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'], cue: '2-count pause just below the knee on the way up' },
    deficit_deadlift:{ name: 'Deficit Deadlift', tm: 'deadlift', mult: 0.85, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'], cue: 'Stand on a 1-2 in plate' },
    rdl:             { name: 'Romanian Deadlift', tm: 'deadlift', mult: 0.60, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'], cue: 'Soft knees, hips back, bar to mid-shin, no bounce' },
    block_pull:      { name: 'Block Pull', tm: 'deadlift', mult: 1.05, load: 'bar', group: 'hinge', muscles: ['back', 'glutes'], cue: 'Bar just below the knee' },
    lat_pulldown:    { name: 'Lat Pulldown', tm: null, load: 'machine', group: 'pull', muscles: ['back', 'biceps'], startHint: 'About a 12-rep weight' },
    low_row:         { name: 'Low Row', tm: null, load: 'machine', group: 'pull', muscles: ['back', 'biceps'], startHint: 'About a 12-rep weight' },
    db_row:          { name: 'Chest-Supported DB Row', tm: null, load: 'db', group: 'pull', muscles: ['back', 'biceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    face_pull:       { name: 'Face Pull', tm: null, load: 'machine', group: 'pull', muscles: ['rear delts', 'back'], startHint: 'Light, about a 15-rep weight (pulldown station)' },
    leg_curl:        { name: 'Seated Leg Curl', tm: null, load: 'machine', group: 'legs', muscles: ['hamstrings'], startHint: 'About a 12-rep weight' },
    leg_ext:         { name: 'Leg Extension', tm: null, load: 'machine', group: 'legs', muscles: ['quads'], startHint: 'About a 12-rep weight' },
    split_squat:     { name: 'DB Split Squat', tm: null, load: 'db', group: 'legs', muscles: ['quads', 'glutes'], startHint: 'Per dumbbell, about a 12-rep weight' },
    tri_pushdown:    { name: 'Triceps Pushdown', tm: null, load: 'machine', group: 'arms', muscles: ['triceps'], startHint: 'About a 12-rep weight (pulldown station)' },
    db_oh_tri:       { name: 'DB Overhead Triceps Extension', tm: null, load: 'db', group: 'arms', muscles: ['triceps'], startHint: 'One dumbbell, about a 12-rep weight' },
    db_curl:         { name: 'DB Curl', tm: null, load: 'db', group: 'arms', muscles: ['biceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    machine_curl:    { name: 'Low-Row Station Curl', tm: null, load: 'machine', group: 'arms', muscles: ['biceps'], startHint: 'About a 12-rep weight' },
    lateral_raise:   { name: 'DB Lateral Raise', tm: null, load: 'db', group: 'arms', muscles: ['delts'], startHint: 'Per dumbbell, about a 15-rep weight' },
    hanging_raise:   { name: 'Hanging Knee Raise', tm: null, load: 'bw', group: 'core', muscles: ['abs'] },
    cable_crunch:    { name: 'Pulldown Crunch', tm: null, load: 'machine', group: 'core', muscles: ['abs'], startHint: 'About a 15-rep weight' },
  };

  // Which exercises may fill each slot (first = default when the block names none).
  const SWAPS = {
    squat_primary: ['comp_squat'],
    bench_primary: ['comp_bench'],
    deadlift_primary: ['comp_deadlift'],
    bench_secondary: ['comp_bench', 'spoto_press', 'larsen_press', 'paused_bench'],
    squat_variation: ['belt_squat', 'paused_squat', 'tempo_squat', 'high_bar_squat', 'low_bar_squat', 'comp_squat'],
    bench_variation: ['close_grip', 'paused_bench', 'spoto_press', 'larsen_press', 'comp_bench'],
    hinge_variation: ['rdl', 'paused_deadlift', 'deficit_deadlift', 'block_pull', 'comp_deadlift'],
    press_secondary: ['ohp', 'db_shoulder', 'db_incline'],
    hamstrings: ['leg_curl', 'rdl'],
    quads: ['leg_ext', 'belt_squat', 'split_squat'],
    back_vertical: ['lat_pulldown', 'db_row'],
    back_horizontal: ['low_row', 'db_row', 'lat_pulldown'],
    rear_delts: ['face_pull', 'lateral_raise'],
    triceps: ['tri_pushdown', 'db_oh_tri'],
    biceps: ['db_curl', 'machine_curl'],
    delts: ['lateral_raise', 'face_pull'],
    abs: ['hanging_raise', 'cable_crunch'],
  };

  // ---------- Blocks ----------
  // pct is of (TM x exercise mult). With TM = 90% 1RM:
  //   Build:    primaries 70-77% 1RM for 7-8 reps (hypertrophy zone 60-75%, 6-10 reps; pp.17, 338)
  //   Strength: primaries 76-86% 1RM for 3-5 reps (75-90%, 3-6 reps; pp.18, 62, 339)
  //   Peak:     primaries 85-90% for 1-3 reps, then a test week (p.340)
  // Week-to-week: +2.5-3% load and 0-1 set in Build, load only in Strength (pp.79-82, 338-339).
  const BLOCKS = [
    {
      id: 'build', name: 'Build', focus: 'Muscle and work capacity', weeks: 4, deload: true,
      primary:   [{ sets: 3, reps: 8, pct: 0.775 }, { sets: 4, reps: 8, pct: 0.80 }, { sets: 4, reps: 8, pct: 0.825 }, { sets: 4, reps: 7, pct: 0.85 }],
      // Deadlift reps-at-percentage run about a rep under squat and bench and the erectors pay for 8s,
      // so the deadlift builds with 5-6s at 72-79% 1RM and the RDL carries the hamstring volume.
      primaryByLift: { deadlift: [{ sets: 3, reps: 6, pct: 0.80 }, { sets: 4, reps: 6, pct: 0.825 }, { sets: 4, reps: 6, pct: 0.85 }, { sets: 4, reps: 5, pct: 0.875 }] },
      secondary: [{ sets: 3, reps: 8, pct: 0.75 }, { sets: 3, reps: 8, pct: 0.775 }, { sets: 4, reps: 8, pct: 0.80 }, { sets: 4, reps: 8, pct: 0.825 }],
      accessory: [{ sets: 2, reps: 12 }, { sets: 3, reps: 12 }, { sets: 3, reps: 12 }, { sets: 3, reps: 12 }],
      plus: 2, light: { vol: 0.5, int: 0.9 }, deloadA: { vol: 0.5, int: 0.9 }, deloadB: { vol: 0.5, int: 0.5 },
      // Two variation sets, alternating between the two runs of the block in a macro (p.250: rotate
      // once per mesocycle; p.252: change the force line periodically). The squat variation is a
      // barbell squat so the squat is grooved twice a week (5-9 weekly sets per lift is where the
      // strength dose-response sits); the belt squat stays one swap away.
      variation: { squat_variation: 'paused_squat', bench_variation: 'close_grip', hinge_variation: 'rdl' },
      variationB: { squat_variation: 'high_bar_squat', bench_variation: 'larsen_press', hinge_variation: 'deficit_deadlift' },
    },
    {
      id: 'strength', name: 'Strength', focus: 'Heavier, fewer reps', weeks: 3, deload: true,
      // Week 3 opens with one single at ~92% 1RM (RPE 8 on the chart) before the triples: the
      // routine max anchor coaches use instead of a test week, and strong evidence for calibration.
      // Week 1 keeps the second lift at 2 sets so the Build -> Strength step in counted barbell sets
      // stays under ~30% (the week-2 scheme brings the third set back; earned sets go to the competition lift only).
      primary:   [{ sets: 4, reps: 5, pct: 0.85 }, { sets: 4, reps: 4, pct: 0.90 }, { sets: 3, reps: 3, pct: 0.95, opener: { pct: 1.02, rpe: 8 } }],
      secondary: [{ sets: 2, reps: 5, pct: 0.80 }, { sets: 3, reps: 5, pct: 0.83 }, { sets: 3, reps: 4, pct: 0.86 }],
      accessory: [{ sets: 2, reps: 10 }, { sets: 3, reps: 10 }, { sets: 3, reps: 8 }],
      plus: 1, light: { vol: 0.7, int: 0.7 }, deloadA: { vol: 0.7, int: 0.7 }, deloadB: { vol: 0.5, int: 0.5 },
      variation: { squat_variation: 'paused_squat', bench_variation: 'paused_bench', hinge_variation: 'paused_deadlift' },
      variationB: { squat_variation: 'high_bar_squat', bench_variation: 'spoto_press', hinge_variation: 'block_pull' },
    },
    {
      id: 'peak', name: 'Peak & Test', focus: 'Express strength, set new maxes', weeks: 2, deload: false, test: true,
      primary:   [{ sets: 3, reps: 3, pct: 0.95 }, { sets: 3, reps: 2, pct: 1.0 }],
      secondary: [{ sets: 3, reps: 4, pct: 0.80 }, { sets: 2, reps: 3, pct: 0.80 }],
      accessory: [{ sets: 2, reps: 10 }, { sets: 1, reps: 10 }],
      plus: 0, light: { vol: 0.5, int: 0.8 }, deloadA: { vol: 0.9, int: 0.5 }, deloadB: { vol: 0.5, int: 0.5 },
      variation: { squat_variation: 'comp_squat', bench_variation: 'comp_bench', hinge_variation: 'comp_deadlift' },
    },
  ];
  // The macro: two hypertrophy mesocycles, two strength mesocycles, an optional peak and test, then
  // an easy week (intermediates: 2-3 months per phase, pp.285, 313, 338-339; active rest once or
  // twice a year, p.155). Each block's second run uses its alternate variation set.
  const MACRO = [{ block: 'build', variant: 'A' }, { block: 'build', variant: 'B' }, { block: 'strength', variant: 'A' }, { block: 'strength', variant: 'B' }, { block: 'peak', variant: 'A' }];
  const blockIndex = (id) => BLOCKS.findIndex(b => b.id === id);
  // Active rest: 50% volume / 50% intensity, non-competition lifts (pp.155, 343).
  const REST = { primary: { sets: 2, reps: 5, pct: 0.50 }, secondary: { sets: 2, reps: 6, pct: 0.50 }, accessory: { sets: 2, reps: 12 },
    variation: { squat_primary: 'high_bar_squat', bench_primary: 'close_grip', deadlift_primary: 'paused_deadlift', bench_secondary: 'spoto_press', squat_variation: 'tempo_squat', bench_variation: 'larsen_press', hinge_variation: 'rdl' } };
  const TEST = { warmups: [{ reps: 5, pct: 0.55 }, { reps: 3, pct: 0.70 }, { reps: 2, pct: 0.80 }, { reps: 1, pct: 0.90 }, { reps: 1, pct: 0.97 }, { reps: 1, pct: 1.03 }], backoff: { sets: 2, reps: 3, pct: 0.80 } };

  // ---------- Tunable thresholds (one place, so simulations can sweep them) ----------
  const TUNE = {
    // Red needs at least two poor answers (one bad night barely moves maximal strength); yellow is
    // the common so-so day and gets a small load nudge rather than a volume cut.
    readiness: { green: 60, yellow: 35 },
    trim: { load: 0.975 },
    // In-session: a hard first set counts in full (RPE rises set to set at a fixed load, so a hard
    // first set predicts harder later sets); an easy day may push the remaining sets up by at most
    // 2.5% (never in Peak). Stop rules: a miss, a non-first set 2+ over target, or the floor.
    correction: { firstSetWeight: 0.5, firstSetHardWeight: 1.0, floor: 0.85, ceil: 1.025, ceilPeak: 1.0, minRpe: 4, lowRpeWeight: 0.35, stopOver: 2, stopMin: 8.5, floorStep: 0.925, floorHard: 1 },
    sessionCapMin: 75, // the top of the owner's 60-75 minute budget; estimates assume a full rest after every set
    calibrate: { downAt: 0.97, downMax: 0.95, downConfHigh: 1.5, downSure: 0.95, upAt: 1.02, upMax: 1.025, upFastAt: 1.04, allowance: 0.03, blockFloor: 0.90, blockFloorMissed: 0.85, minRpe: 6.5 },
    review: { add: 2, cut: -2, bigCut: -4, onTarget: 1 },
    // Deload-now triggers: within the week, and across the block (chronic under-recovery that
    // stays under the weekly triggers: many reds, repeated calibration drops, readiness trend).
    deload: { flaggedLifts: 2, redsWeek: 2, crushedWeek: 2, redsBlock: 4, calibDropsLift: 2, calibDropPct: 0.06, lightsBlock: 4, readinessDrop: 15, readinessLow: 45, readinessAbs: 55, readinessVeryLow: 40, readinessWeeks: 2, chronicFromWeek: 2, dialStepsPerBlock: 1, readinessMovesDial: true },
    // Volume dial: a lasting, program-wide set offset (-2..+2) that finds the lifter's recoverable
    // volume across blocks. Down one step whenever block-level fatigue forces a deload; up one step
    // after a block that stayed clean while already adding sets.
    dial: { min: -2, max: 2 },
  };

  // Hard weekly caps on working sets for each competition pattern (comp lift + barbell variants).
  // Set additions can never climb past these, so the volume that buried you stays out of reach.
  const CAPS = { squat: 12, bench: 16, deadlift: 9 };
  // Each phase has its own recoverable volume (pp.123-126): hypertrophy highest, peaking lowest.
  const CAPS_BY_BLOCK = { build: { squat: 14, bench: 18, deadlift: 10 }, strength: { squat: 12, bench: 16, deadlift: 9 }, peak: { squat: 8, bench: 12, deadlift: 6 } };
  function capFor(state, lift) { const b = BLOCKS[clampProgram(state).blockIdx]; return (CAPS_BY_BLOCK[b.id] || CAPS)[lift]; }
  const ACC_CAP = 4;

  // ---------- Four-day layout ----------
  // Squat 2x, bench muscles 3x (one overload), deadlift heavy 1x + a hinge variant (pp.219-220).
  const DAYS = [
    { id: 'A', name: 'Squat day', slots: [
      { key: 'squat_primary', role: 'primary', tm: 'squat' },
      { key: 'bench_secondary', role: 'secondary', tm: 'bench' },
      { key: 'hamstrings', role: 'accessory' },
      { key: 'back_vertical', role: 'accessory' },
      { key: 'abs', role: 'accessory', optional: true }] },
    // The hinge variation sits on bench day: two days before the heavy pull and the day after the
    // squat, not 24 h after the deadlift (deadlift and hamstring recovery is the slowest, pp.135,
    // 140, 219-220). Friday is upper body only, so Monday's squat follows three days without a bar.
    { id: 'B', name: 'Bench day', slots: [
      { key: 'bench_primary', role: 'primary', tm: 'bench' },
      { key: 'hinge_variation', role: 'secondary', tm: 'deadlift' },
      { key: 'back_horizontal', role: 'accessory' },
      { key: 'triceps', role: 'accessory' },
      { key: 'biceps', role: 'accessory', optional: true }] },
    { id: 'C', name: 'Deadlift day', slots: [
      { key: 'deadlift_primary', role: 'primary', tm: 'deadlift' },
      { key: 'squat_variation', role: 'secondary', tm: 'squat' },
      { key: 'quads', role: 'accessory' },
      { key: 'rear_delts', role: 'accessory' },
      { key: 'abs', role: 'accessory', optional: true }] },
    { id: 'D', name: 'Bench variation day', slots: [
      { key: 'bench_variation', role: 'secondary', tm: 'bench' },
      { key: 'press_secondary', role: 'secondary', tm: 'bench' },
      { key: 'back_vertical', role: 'accessory' },
      { key: 'delts', role: 'accessory', optional: true },
      { key: 'triceps', role: 'accessory' }] },
  ];

  // ---------- Readiness ----------
  // sleep, energy, motivation: 1 (worst) .. 5 (best). soreness: 1 (fresh) .. 5 (wrecked).
  function readinessScore(r) {
    r = r || {};
    const s = (v) => { const n = Number(v); return (Number.isFinite(n) ? Math.min(5, Math.max(1, n)) - 1 : 2) / 4; };
    const score = 100 * (0.30 * s(r.sleep) + 0.25 * s(r.energy) + 0.25 * (1 - s(r.soreness)) + 0.20 * s(r.motivation));
    const color = score >= TUNE.readiness.green ? 'green' : score >= TUNE.readiness.yellow ? 'yellow' : 'red';
    return { score: Math.round(score), color };
  }
  // Soreness by muscle group (1 none .. 4 very sore) -> the 1..5 soreness answer.
  function sorenessFromGroups(g) {
    const m = Math.max(g.legs || 1, g.push || 1, g.hinge || 1);
    return { 1: 1, 2: 2.5, 3: 4, 4: 5 }[m] || 1;
  }
  // Modes. 'full' = the plan. 'trim' (yellow) keeps the loads (most so-so days still allow an
  // overload, p.96) but drops bonus reps and any earned set additions. 'light' (red) is the
  // book's light session for the block: volume and intensity as fractions of the overload day
  // (pp.148-149). Light beats a day off for both fatigue and fitness (p.179).
  const MODES = { full: { label: 'As planned' }, trim: { label: 'Trimmed' }, light: { label: 'Light session' } };

  // ---------- Session generation ----------
  function tmOf(state, lift) { return state.lifts[lift].tm; }
  // The "other" bar position is the variation: high-bar for a low-bar competitor and vice versa.
  function otherSquat(state) { return state.settings.squatStyle === 'highbar' ? 'low_bar_squat' : 'high_bar_squat'; }
  function resolveExercise(state, slot, block, rest) {
    const sw = state.program.swaps || {};
    let id;
    const vset = (state.program.variantSet === 'B' && block.variationB) ? block.variationB : block.variation;
    if (sw[slot.key] && EX[sw[slot.key]] && SWAPS[slot.key].includes(sw[slot.key])) id = sw[slot.key];
    else if (rest && REST.variation[slot.key]) id = REST.variation[slot.key];
    else if (vset && vset[slot.key]) id = vset[slot.key];
    else id = SWAPS[slot.key][0];
    if (id === 'high_bar_squat' || id === 'low_bar_squat') id = otherSquat(state);
    if (!EX[id]) id = SWAPS[slot.key][0];
    return id;
  }
  function clampProgram(state) {
    const P = state.program;
    if (!(P.blockIdx >= 0 && P.blockIdx < BLOCKS.length)) P.blockIdx = 0;
    const tw = totalWeeks(BLOCKS[P.blockIdx]);
    if (!(P.week >= 1 && P.week <= tw)) P.week = Math.min(Math.max(1, Math.round(P.week) || 1), tw);
    if (!(P.dayIdx >= 0 && P.dayIdx < DAYS.length)) P.dayIdx = 0;
    if (P.special && !(P.special.weeksLeft > 0)) P.special.weeksLeft = 1;
    if (P.special && P.special.type !== 'rest' && P.special.type !== 'deload') P.special = null;
    if (typeof P.calibDrops !== 'object' || !P.calibDrops) P.calibDrops = {};
    P.setAdj = Object.assign({ squat: 0, bench: 0, deadlift: 0, acc: 0 }, P.setAdj || {});
    P.loadAdj = Object.assign({ squat: 0, bench: 0, deadlift: 0 }, P.loadAdj || {});
    P.flags = Object.assign({ squat: 0, bench: 0, deadlift: 0 }, P.flags || {});
    return P;
  }
  function exerciseName(state, exId) {
    if (exId === 'comp_squat') return `Competition Squat (${state.settings.squatStyle === 'highbar' ? 'high-bar' : 'low-bar'})`;
    if (exId === 'comp_deadlift') return `Competition Deadlift (${state.settings.deadliftStyle === 'sumo' ? 'sumo' : 'conventional'})`;
    return EX[exId].name;
  }
  // Swap choices for a slot, hiding the bar position that is already the competition squat.
  function swapOptions(state, slotKey) {
    const hide = state.settings.squatStyle === 'highbar' ? 'high_bar_squat' : 'low_bar_squat';
    return (SWAPS[slotKey] || []).filter(x => x !== hide);
  }
  function accWeight(state, ex) { const a = (state.acc || {})[ex]; return a && a.weight != null ? a.weight : null; }
  function position(state) {
    const P = clampProgram(state), block = BLOCKS[P.blockIdx];
    const rest = !!(P.special && P.special.type === 'rest');
    const inserted = !!(P.special && P.special.type === 'deload'); // a deload week taken early; the block resumes after it
    const isDeload = !rest && ((block.deload && P.week > block.weeks) || inserted);
    const isTest = !rest && !inserted && block.test && P.week > block.weeks;
    return { block, rest, isDeload, isTest, inserted, wk: Math.min(P.week, block.weeks) - 1, day: DAYS[P.dayIdx] };
  }

  function buildSession(state, mode) {
    const P = state.program, S = state.settings;
    const { block, rest, isDeload, isTest, inserted, wk, day } = position(state);
    mode = MODES[mode] ? mode : 'full';
    const out = { block: rest ? 'rest' : block.id, blockName: rest ? 'Easy week' : block.name, week: P.week, isDeload, isTest, isRest: rest, dayId: day.id, dayName: day.name, mode, exercises: [], notes: [] };
    const firstHalf = P.dayIdx < 2;
    const lastWk = inserted ? Math.max(0, Math.min(P.week, block.weeks) - 1) : block.weeks - 1; // an inserted deload is relative to the week it interrupts

    const inc = S.increment > 0 ? S.increment : 5, bar = S.barWeight > 0 ? S.barWeight : 45;
    for (const slot of day.slots) {
      const exId = resolveExercise(state, slot, block, rest);
      const ex = EX[exId];
      // A TM-loaded exercise in an accessory slot (RDL for hamstrings) takes its lift from the
      // exercise and follows the second-lift scheme.
      const lift = ex.tm ? (slot.tm || ex.tm) : null;
      const schemeRole = slot.role === 'accessory' && ex.tm ? 'secondary' : slot.role;
      const heavyBlock = block.id !== 'build' && !rest; // heavy triples and singles earn +60 s on the main lift
      const item = { slotKey: slot.key, ex: exId, name: exerciseName(state, exId), role: slot.role, lift, load: ex.load, optional: !!slot.optional, cue: ex.cue || null, sets: [],
        rest: slot.role === 'primary' ? S.restPrimary + (heavyBlock ? 60 : 0) : slot.role === 'secondary' ? S.restSecondary : S.restAccessory };

      // --- Test week: primaries work up to a heavy single ---
      if (isTest && slot.role === 'primary') {
        const tm = tmOf(state, lift);
        const firstW = barRound(tm * TEST.warmups[0].pct, bar, inc, S.plates);
        let prevW = 0;
        if (S.warmupSets !== false) for (const st of warmups(firstW, bar, inc, 'lead', S.plates)) { item.sets.push({ w: st.w, reps: st.reps, kind: 'warm' }); prevW = st.w; }
        for (const w of TEST.warmups) {
          if (w.pct < 0.8 && S.warmupSets === false) continue; // the 80% and 90% lines are part of the test, not generic warm-ups
          const tw = barRound(tm * w.pct, bar, inc, S.plates);
          if (tw <= prevW && w.pct < 0.97) continue; // never repeat a weight or step back
          item.sets.push({ w: tw, reps: w.reps, pct: w.pct, kind: w.pct >= 0.97 ? 'test' : 'warm', rpeTarget: w.pct >= 1.03 ? 9 : w.pct >= 0.97 ? 8 : null }); prevW = tw;
        }
        item.sets.push({ w: null, reps: 1, pct: null, kind: 'test', rpeTarget: 9, open: true });
        for (let i = 0; i < TEST.backoff.sets; i++) item.sets.push({ w: barRound(tm * TEST.backoff.pct, bar, inc, S.plates), reps: TEST.backoff.reps, pct: TEST.backoff.pct, kind: 'work', rpeTarget: 7 });
        item.note = 'Work up to one single at RPE 9 (one clean rep left). Add 2-5% to the last line if the single before it was RPE 8 or less. Stop there, then do the back-off sets.';
        out.exercises.push(item);
        continue;
      }

      if (ex.tm) {
        // ----- Barbell lift loaded from a TM -----
        let base, volF = 1, intF = 1;
        const schemeFor = (w) => (schemeRole === 'primary' && block.primaryByLift && block.primaryByLift[lift]) ? block.primaryByLift[lift][w] : block[schemeRole][w];
        if (rest) { base = REST[schemeRole]; }

  function finishSetup() {

    const s = state.settings;
    s.name = d.name.trim(); s.tmPct = Number(d.tmPct); s.barWeight = barW; s.plates = d.plates.slice().sort((a, b) => b - a);
    s.increment = Math.min(10, E.loadStep(s.plates)); s.dbIncrement = Number(d.dbIncrement); s.days = d.days.slice();
    s.cardioMin = Math.max(0, Number(d.cardioMin) || 0); s.cardioWatts = Number(d.cardioWatts) || 110; s.deadliftStyle = d.deadliftStyle; s.squatStyle = d.squatStyle; s.includePeak = !!d.includePeak;
    s.tmPctChosen = s.tmPct;

    if (d.easyWeek) E.startActiveRest(state, 1);
    state.setupDone = true; state.migratedV2 = true; // a fresh program has nothing to migrate
    addLog(`Program started. 1RMs: squat ${state.lifts.squat.oneRM}, bench ${state.lifts.bench.oneRM}, deadlift ${state.lifts.deadlift.oneRM}. Training maxes at ${Math.round(s.tmPct * 100)}%.`);
    state = cleanState(state, true); // the same clamps a reload applies, so what you see is what is stored
    ui.draft = null; view = 'today'; save(); render();
  }

  // ---------- Today ----------
  function renderToday() {
    if (state.current) {
      if (state.current.phase === 'lift' || state.current.phase === 'edit') return renderSession();
      if (state.current.phase === 'post') return renderPost();
      if (state.current.phase === 'cardio') return renderCardio();
    }
    // A check-in left open for hours (or since another day) is stale: start a fresh one.
    if (ui.checkin && (Date.now() - (ui.checkin.at || 0) > 3 * 3600000 || ui.checkin.day !== todayISO())) ui.checkin = null;
    if (ui.checkin) return renderCheckin();
    const pos = E.positionLabel(state), P = state.program;
    // The preview shows the session you will most likely get: light for the rest of a two-red week,
    // trimmed while pushing on past a deload suggestion (a deload, easy or test week runs as planned).
    const lightWk = pos.isRest || pos.isDeload || pos.isTest;
    const planMode = lightWk ? 'full' : P.lightRestOfWeek ? 'light' : P.pushOn ? 'trim' : 'full';
    const plan = E.buildSession(state, planMode);
    const last = lastSession();
    let html = '';
    if (P.pendingDeload && !pos.isDeload && !pos.isRest) html += `<div class="card"><h3>Deload suggested</h3><p>Fatigue signals stacked up in your weekly review (the Program tab's log says which). The book's rule is to take the deload now rather than grind into it; the block picks up where it left off afterwards. Your call.</p><div class="btnrow"><button class="btn primary" data-action="deload-now">Deload this week</button><button class="btn" data-action="deload-later">Push on</button></div></div>`;
    if (P.lightRestOfWeek) html += `<div class="callout warn">Rest of this week is set to light sessions (two red check-ins). Loads and sets come down automatically; the week still counts.</div>`;
    else if (P.pushOn) html += `<div class="callout warn">Pushing on past a deload suggestion: this week runs without bonus reps or earned sets, loads one step down. If it still feels heavy, "Deload now" is on the Program tab.</div>`;
    // Coming back after a gap: offer the layoff rule once per gap (the book: ease back in, do not
    // resume where you left off, p.250).
    const newest = newestSessionDate(), gap = newest ? daysBetween(newest, todayISO()) : 0;
    if (gap >= 7 && P.layoffHandled !== newest && (gap >= 14 || (!pos.isRest && !pos.isDeload))) { // a deload or easy week is light enough for a short gap, not for a long one
      const what = gap < 14 ? 'repeat this week 5% lighter with earned sets cleared' : gap < 21 ? 'restart this block at week 1 with maxes 5% lower' : 'start again from Build week 1 with maxes 10% lower (they recalibrate from your sets)';
      html += `<div class="card"><h3>${gap} days since your last session</h3><p>Coming back at the old loads after a layoff is how people get hurt. The program's rule for ${gap} days off: ${what}.</p>
        <div class="btnrow"><button class="btn primary" data-action="layoff-ease">Ease back in</button><button class="btn" data-action="layoff-skip">Carry on as planned</button></div></div>`;
    }
    if (state.backupOffer && !Store.db && state.settings.backupOffer) html += `<div class="callout row between offer-bar"><span>Back up this session? <span class="muted small">(${backupSizeText()})</span></span><span class="row nowrap" style="gap:6px"><button class="btn sm primary" data-action="share-backup">Save backup</button><button class="btn sm quiet icon" data-action="offer-dismiss" aria-label="Not now">✕</button></span></div>`;
    html += `<div class="card accent hero">
      <div class="row between hero-top"><span class="tiny">${pos.isRest ? 'Easy week' : pos.isDeload ? 'Deload week' : pos.isTest ? 'Test week' : `${esc(pos.block.name)} block · ${esc(pos.label)}`}</span><span class="tiny">${fmtDateLong(todayISO())}</span></div>
      <h1>${esc(plan.dayName)}</h1>
      ${previewTime(plan, planMode)}
      ${previewPlan(plan)}
      ${plan.notes.map(n => `<p class="small pv-note">${esc(n)}</p>`).join('')}
      <button class="btn block cta" data-action="checkin">Check in and start</button>
    </div>
    <div class="row between small hero-after"><button class="btn sm quiet" data-action="skip-session">Skip this session</button>${ui.backfill ? '' : '<button class="btn sm quiet" data-action="backfill-open">Log a past session</button>'}</div>`;
    if (ui.backfill) html += renderBackfill(plan);
    // What happened after the last session: three lines, the rest on a tap (a week review can run long).
    if (state.lastReport) {
      const repKey = state.lastReport.title + '|' + state.lastReport.lines.length, lines = state.lastReport.lines, many = lines.length > 3 && ui.reportAll !== repKey;
      const cls = (l) => l.includes('-1 set') || l.includes('easing') || /(\d+(?:\.\d+)?) -> (\d+(?:\.\d+)?)/.test(l) && Number(RegExp.$2) < Number(RegExp.$1) ? 'warn' : l.includes('+1 set') || l.includes('->') ? 'good' : '';
      html += `<div class="card"><div class="row between"><h3>${esc(state.lastReport.title)}</h3><button class="btn sm quiet" data-action="dismiss-report">Dismiss</button></div>${(many ? lines.slice(0, 3) : lines).map(l => `<div class="callout ${cls(l)}">${arrows(l)}</div>`).join('')}${many ? `<button class="btn sm quiet" data-action="report-all">Show all ${lines.length} lines</button>` : ''}</div>`;
    }

    if (last) {
      const d = daysBetween(last.date, todayISO());
      html += `<div class="card"><h3>Last session</h3><div class="row between"><div><b>${esc(last.dayName)}</b> <span class="muted small">${fmtDate(last.date)}${d === 0 ? ' (today)' : d === 1 ? ' (yesterday)' : ` (${d} days ago)`}</span></div>${last.readiness ? `<span class="pill ${last.readiness.color}">Readiness ${last.readiness.score}</span>` : ''}</div>
        <div class="small muted">${last.post ? DIFF[last.post.difficulty] : ''}${last.durationMin ? ` · ${last.durationMin} min` : ''}${last.cardio && last.cardio.min ? ` · bike ${last.cardio.min} min` : ''}${last.mode && last.mode !== 'full' && E.MODES[last.mode] ? ` · ${E.MODES[last.mode].label}` : ''}</div></div>`;

  }
  // Logging a session after the fact: the next planned session, dated back, with no check-in or
  // timer. It then goes through exactly the same completion, calibration and review as a live one.
  function renderBackfill(plan) {
    const b = ui.backfill;
    if (!b) return '';
    return `<div class="card"><h3>Log a past session</h3>
      <p class="small muted">This logs <b>${esc(plan.dayName)}</b>, the next session in the plan, on the date you pick. Enter what you lifted; it counts in the week's review and the maxes calibrate from it like any other session.</p>
      <div class="grid2"><label class="f">Date<input id="bf-date" type="date" value="${esc(b.date)}" max="${todayISO()}" min="${backfillMin()}" data-backfill="date"></label>
      <label class="f">How it was run<select id="bf-mode" data-backfill="mode">${['full', 'trim', 'light'].map(m => `<option value="${m}" ${b.mode === m ? 'selected' : ''}>${E.MODES[m].label}</option>`).join('')}</select></label></div>
      <div class="btnrow"><button class="btn primary" data-action="backfill-start">Open the session</button><button class="btn" data-action="backfill-cancel">Cancel</button></div></div>`;

  // The earliest date a past session can take: the plan runs in order, so not before the newest
  // logged session (or a layoff restart), and not more than 60 days back.
  function backfillMin() {
    const m = new Date(); m.setDate(m.getDate() - 60); let min = todayISO(m);
    const newest = newestSessionDate(); if (newest && newest > min) min = newest;
    const cs = state.program.chronicSince; if (cs) { const c = tsISO(cs); if (c > min) min = c; }
    return min;
  }
  function startBackfill() {
    const b = ui.backfill; if (!b) return;
    const date = /^\d{4}-\d{2}-\d{2}$/.test(b.date) ? b.date : null, min = backfillMin();
    if (!date || date > todayISO() || date < min) { toast(`Pick a date from ${fmtDate(min)} to today`); return; }

  function renderWeekBrief() {
    const P = state.program, pos = E.positionLabel(state);

    // kind of week has to match as well.

  }
  function extraThisWeek() {
    const t = new Date(), day = (t.getDay() + 6) % 7; const mon = new Date(t); mon.setDate(t.getDate() - day); const monISO = todayISO(mon);

    for (const s of state.sessions) if (s.date >= monISO && s.cardio && s.cardio.min) { min += s.cardio.min; kcal += s.cardio.kcal || E.cardioKcal(s.cardio.min, state.settings.cardioWatts); }
    for (const c of state.extraCardio || []) if (c.date >= monISO) { min += c.min; kcal += c.kcal; }

  }

  // ---------- Check-in ----------
  function startCheckin() {
    const last = lastSession();
    ui.checkin = { sleep: 0, energy: 0, motivation: 0, groups: { legs: 0, push: 0, hinge: 0 }, askGroups: !!last && !last.soreness, result: null, choice: null, at: Date.now(), day: todayISO() };
    ui.backfill = null;
    render(); scrollToY(0);
  }
  function renderCheckin() {
    const c = ui.checkin;
    // plain: words only. Soreness runs best-to-worst while the other scales run worst-to-best, so
    // numbers on both would point opposite ways.
    const seg = (key, labels, plain) => `<div class="seg${plain ? ' plain' : ''}">${labels.map((t, i) => `<button data-action="ci" data-k="${key}" data-v="${i + 1}" aria-pressed="${(key.includes(':') ? c.groups[key.split(':')[1]] : c[key]) === i + 1}">${plain ? `<span>${t}</span>` : `${i + 1}<small>${t}</small>`}</button>`).join('')}</div>`;
    const SORE = ['Fresh', 'Slightly sore', 'Sore', 'Very sore'];
    if (c.result) {
      const r = c.result, pos = E.positionLabel(state);
      const lightWeek = pos.isDeload || pos.isRest || pos.isTest;
      const plan = E.buildSession(state, c.choice || r.mode);
      const explain = pos.isTest ? `Test week: readiness doesn't change a test, it is recorded for your trend.${r.color === 'red' ? ' On a red day a max attempt will undersell you; resting today and testing another day is the better call.' : ''}`
        : lightWeek ? `${pos.isRest ? 'Easy week' : 'Deload week'}: this session is already as light as the program gets, so readiness is recorded for your trend but doesn't change it.${r.color === 'red' ? ' If you feel genuinely wrecked, resting today and keeping the session is fine.' : ''}`
        : state.program.lightRestOfWeek ? 'The rest of this week is set to light sessions after two red check-ins, so today runs light whatever the score. Readiness is recorded for your trend.'
        : state.program.pushOn && r.color !== 'red' ? 'You chose to push on past a deload suggestion, so this week runs trimmed whatever the score: no bonus reps or earned sets, loads one step down.'
        : r.color === 'green' ? 'Good to go. Loads and sets as planned, and the first set of each main lift can take bonus reps if it moves well.'
        : r.color === 'yellow' ? 'So-so day. The book\'s rule: most days like this still allow an overload, so the session stands, trimmed: loads one step down (2.5%), no bonus reps, no earned extra sets. Same reps, same number of planned sets.'

      return `<div class="card">
        <div class="row between"><h2>Readiness ${r.score}</h2><span class="pill ${r.color}">${r.color === 'green' ? 'Good to go' : r.color === 'yellow' ? 'So-so' : 'Rough day'}</span></div>

        ${r.color === 'red' && !lightWeek ? `<div class="seg wrap">
            <button data-action="ci-choice" data-v="light" aria-pressed="${c.choice === 'light'}">Light session<small>recommended</small></button>
            ${state.program.lightRestOfWeek ? '' : `<button data-action="ci-choice" data-v="${state.program.pushOn ? 'trim' : 'full'}" aria-pressed="${c.choice === (state.program.pushOn ? 'trim' : 'full')}">${state.program.pushOn ? 'Trimmed' : 'As planned'}<small>if you know it's not fatigue</small></button>`}
          </div>
          <button class="btn block" data-action="ci-rest">Rest today, keep this session for next time</button>` : ''}
        <h3>${esc(plan.dayName)}</h3>${previewTime(plan, c.choice || r.mode)}${previewPlan(plan)}
        <div class="btnrow"><button class="btn" data-action="ci-back">Back</button><button class="btn primary" data-action="start-session" data-mode="${c.choice || r.mode}">Start ${E.MODES[c.choice || r.mode].label.toLowerCase()}</button></div>
      </div>`;
    }
    return `<div class="card">
      <h2>Check in</h2><p class="small muted">Be honest, then trust the plan. This takes ${c.askGroups ? 6 : 4} taps.</p>

  // ---------- Post-session ----------

  // ---------- Cardio ----------

      <div class="btnrow">${s.backfill ? '' : !run ? `<button class="btn primary" data-action="cardio-start">Start timer</button>` : run.paused ? `<button class="btn primary" data-action="cardio-resume">Resume</button>` : `<button class="btn" data-action="cardio-pause">Pause</button>`}</div>

      </div>

  }
  function saveCardio(skip, force) {

  // ---------- Completing a session, reviews ----------
  function completeSession() {

    // Accessory double progression.
    const reducedDay = s.isDeload || s.isRest || s.isTest || s.mode === 'light';
    for (const e of s.exercises) {
      if (e.lift || s.skippedSlots.includes(e.slotKey)) continue;
      const prevW = state.acc[e.ex] ? state.acc[e.ex].weight : null, prevSuspect = state.acc[e.ex] ? state.acc[e.ex].suspect : null;
      const p = reducedDay ? null : E.accessoryProgress(state, { load: e.load, repRange: e.repRange, prevW, prevSuspect, sets: e.sets.map(x => ({ done: x.done, w: x.actualW != null ? x.actualW : x.w, reps: x.reps, actualReps: x.actualReps, okW: x.okW })) });
      if (p) { state.acc[e.ex] = p.suspect ? { weight: p.weight, updated: s.date, suspect: p.suspect } : { weight: p.weight, updated: s.date }; if (p.suspect) addLog(`${e.name}: ${p.suspect} looked like a typo next to ${p.weight}, so next time stays at ${p.weight}. Change it in Settings if it was real.`); }
      else { const d = e.sets.find(x => x.done && x.actualW > 0); if (d && !state.acc[e.ex]) state.acc[e.ex] = { weight: d.actualW, updated: s.date }; }

    delete s.cardioRun; delete s.cardioDraft; delete s.setLightRest;
    s.exercises.forEach(e => { delete e.fold; e.sets.forEach(x => { delete x.doneAt; delete x.timerSrc; }); }); delete s.lastEi;
    s.savedAt = Date.now(); delete s.phase;
    state.current = null; state.undo = undoBackfill; stopTimer();
    state.sessions.push(s); Store.pushSession(s);
    if (s.backfill) { state.sessions.sort((a, b) => (a.ts || 0) - (b.ts || 0)); addLog(`${s.dayName} logged after the fact for ${fmtDate(s.date)}.`); }

    if (cal.length) {

      if (fresh) state.lastReport.lines = cal.concat(state.lastReport.lines).slice(0, 30);
      else if (state.lastReport) state.lastReport.lines = state.lastReport.lines.concat(cal).slice(0, 30); // an unread review stays; today's lines join it
      else { const moved = cal.some(l => / -> /.test(l)); state.lastReport = { title: moved ? (s.backfill ? `Maxes calibrated from ${fmtDate(s.date)}` : 'Maxes calibrated from today') : (s.backfill ? `Maxes held after ${fmtDate(s.date)}` : 'Maxes held after today'), lines: cal.slice(0, 30), sessionId: s.id }; }

  }

      const willEndMeso = !pos.rest && P.week >= E.totalWeeks(pos.block);

        const r = E.weeklyReview(state, sessionsOfWeek(), sessionsOfMeso());

        if (r.volumeDial != null) P.volumeDial = r.volumeDial;

  const BUILD = ((document.querySelector('meta[name="readyset-build"]') || {}).content || '').trim();
  let lastUpdateCheck = 0, reloading = false;

  }

  }

    bar.innerHTML = `<span>${state && state.current ? 'A new version is ready. Your session and sets are saved; it installs when you finish, or now if you tap.' : 'A new version of Readyset is ready. Everything is saved.'}</span><button class="btn sm" data-action="apply-update">Update now</button>`;
    const app = $('#app'); if (app) app.insertBefore(bar, app.firstChild);
  }

      applyPendingType(true);
      clearTimeout(notesTimer); notesTimer = null;
      try { sessionStorage.setItem('rs-scroll', JSON.stringify({ view, y: scroller().scrollTop, id: state.current ? state.current.id + ':' + state.current.phase : '' })); } catch (e) { /* ignore */ }
