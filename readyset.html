<title>Readyset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; sticky header, bottom tab bar, cards only where a thing is tappable. */
:root {
  --bg: #eceef1;            /* cool steel paper */
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #d6dae0;
  --fg: #151920;
  --muted: #5f6977;
  --accent: #d9530e;        /* safety orange, like a loading pin */
  --accent-fg: #ffffff;
  --accent-soft: #fde9dc;
  --good: #1f8a4c; --good-soft: #dff3e6;
  --warn: #b7860b; --warn-soft: #fbf0cc;
  --bad: #c73a32;  --bad-soft: #fbe0de;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(10, 20, 40, .06), 0 4px 14px rgba(10, 20, 40, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --line: #2b323c;
    --fg: #e9ecf0; --muted: #98a2b0; --accent: #ff7a30; --accent-fg: #14110e; --accent-soft: #3a2316;
    --good: #46c272; --good-soft: #163a25; --warn: #e5b42c; --warn-soft: #3b3012; --bad: #f0635a; --bad-soft: #43201e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --line: #2b323c;
  --fg: #e9ecf0; --muted: #98a2b0; --accent: #ff7a30; --accent-fg: #14110e; --accent-soft: #3a2316;
  --good: #46c272; --good-soft: #163a25; --warn: #e5b42c; --warn-soft: #3b3012; --bad: #f0635a; --bad-soft: #43201e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.display { font-family: var(--display); }

/* App frame */
#app { min-height: 100%; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.topbar .brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; }
.topbar .brand span { color: var(--accent); }
.topbar .pos { font-family: var(--display); font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: right; }
main { flex: 1; padding-block: 14px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; max-width: 680px; width: 100%; margin: 0 auto; }
main > * { min-width: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.tabbar button { flex: 1; background: none; border: 0; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-family: var(--display); font-size: .95rem; text-transform: uppercase; letter-spacing: .06em; }
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* Cards and sections */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.accent { background: var(--accent); color: var(--accent-fg); }
.card.accent .muted, .card.accent .tiny { color: var(--accent-fg); opacity: .8; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1; }
.kpi .v small { font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: .9rem; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }

/* Segmented choice (1-5 scales, options) */
.seg { display: grid; gap: 6px; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 4px; min-height: 48px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.seg button small { font-weight: 500; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.seg button[aria-pressed="true"] small { color: var(--accent-fg); opacity: .85; }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); }
.q { display: flex; flex-direction: column; gap: 8px; }
.q .label { font-weight: 600; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.green { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.yellow { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.red { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.green { background: var(--good); } .dot.yellow { background: var(--warn); } .dot.red { background: var(--bad); }

/* Exercise block in a session */
.ex { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ex-head { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ex-head .name { font-family: var(--display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
.ex-head .meta { font-size: .85rem; color: var(--muted); }
.ex-note { padding: 0 14px 8px; font-size: .9rem; color: var(--muted); }
.sets { display: flex; flex-direction: column; }
.set { display: grid; grid-template-columns: 34px 1fr 1fr 64px 48px; align-items: center; gap: 6px; padding: 7px 10px 7px 14px; border-top: 1px solid var(--line); min-height: 52px; }
.set .n { font-family: var(--display); color: var(--muted); font-weight: 600; font-size: 1rem; }
.set.done { background: var(--surface-2); }
.set.done .n { color: var(--good); }
.set .field { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
.set .field input { width: 100%; max-width: 92px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.set .field input::-webkit-outer-spin-button, .set .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set .field .u { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.set .rpe { border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; background: var(--surface); text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; width: 100%; }
.set .rpe.empty { color: var(--muted); font-weight: 500; }
.set .ok { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.set .ok svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.set.done .ok { background: var(--good); border-color: var(--good); color: #fff; }
.set .kind { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.ex-foot { padding: 8px 14px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.plates { font-size: .85rem; color: var(--muted); }
.plates b { color: var(--fg); }
.warm { padding: 6px 14px 10px; font-size: .85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.warm span { background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* RPE picker sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 680px; border-radius: 16px 16px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow: auto; }
.rpegrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rpegrid button { border: 1px solid var(--line); border-radius: 8px; padding: 10px 0; font-weight: 700; font-size: 1.1rem; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; align-items: center; }
.rpegrid button small { font-weight: 500; font-size: .65rem; color: var(--muted); text-transform: uppercase; }
.rpegrid button.target { border-color: var(--accent); }

/* Rest timer bar */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 8; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 8px 10px 8px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); font-family: var(--display); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 4px 10px; font-size: .85rem; font-family: var(--body); font-weight: 600; }
.timer.over { background: var(--good); color: #fff; }

/* Forms */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; min-width: 0; }
label.f input, label.f select, label.f textarea { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); font-size: 1rem; font-weight: 500; color: var(--fg); min-height: 44px; width: 100%; }
label.f input[type=number] { font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .9rem; min-height: 36px; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: transparent; }

/* Lists and tables */
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.loglist { display: flex; flex-direction: column; gap: 8px; }
.loglist .item { display: grid; grid-template-columns: 74px 1fr; gap: 10px; font-size: .9rem; }
.loglist .item .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.session-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.session-item:last-child { border-bottom: 0; }

/* Block timeline */
.timeline { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.timeline .w { height: 26px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: .65rem; font-weight: 700; color: var(--muted); }
.timeline .w.build { background: var(--good-soft); color: var(--good); border-color: transparent; }
.timeline .w.strength { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.timeline .w.peak { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.timeline .w.deload { background: var(--surface-2); color: var(--muted); border-style: dashed; }
.timeline .w.now { outline: 2px solid var(--fg); outline-offset: 1px; }
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); }
canvas { width: 100%; height: auto; display: block; }
.empty { text-align: center; color: var(--muted); padding: 20px 10px; }
.callout { border-left: 3px solid var(--accent); padding: 6px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: .92rem; }
.callout.good { border-color: var(--good); } .callout.warn { border-color: var(--warn); } .callout.bad { border-color: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .set, .btn, .seg button { transition: background-color .15s ease, color .15s ease; } }
@media (min-width: 560px) { .set { grid-template-columns: 40px 1fr 1fr 80px 52px; } }

</style>

<script>
/* Readyset engine — pure training logic, no DOM.
   Loads are fractions of the Training Max (TM). TM defaults to 90% of the lifter's 1RM, so a
   "100% TM" set is a ~90% 1RM set. %1RM figures in comments assume that default.
   Sources: Israetel, Hoffmann & Smith, Scientific Principles of Strength Training (2020); page
   numbers in comments refer to that book. */
(function (root) {
  'use strict';

  // ---------- Rep-max math (reps-to-failure -> fraction of 1RM) ----------
  const RM = [0, 1.0, 0.955, 0.922, 0.892, 0.863, 0.837, 0.811, 0.786, 0.762, 0.739, 0.717, 0.694, 0.672, 0.650, 0.630];
  function pctForRTF(n) {
    if (n <= 1) return 1;
    if (n >= 15) return RM[15] * Math.pow(0.978, n - 15);
    const lo = Math.floor(n), hi = Math.ceil(n), f = n - lo;
    return RM[lo] + (RM[hi] - RM[lo]) * f;
  }
  function rtfForPct(p) {
    if (p >= 1) return 1;
    for (let n = 1; n < 40; n++) {
      const a = pctForRTF(n), b = pctForRTF(n + 1);
      if (p <= a && p >= b) return n + (a - p) / (a - b);
    }
    return 40;
  }
  function e1rm(weight, reps, rpe) {
    const rir = Math.max(0, Math.min(6, 10 - rpe));
    return weight / pctForRTF(reps + rir);
  }
  function expectedRIR(pctOf1RM, reps) { return Math.max(0, rtfForPct(pctOf1RM) - reps); }
  function plannedRPE(pctOf1RM, reps) { return Math.min(10, Math.max(5, Math.round((10 - expectedRIR(pctOf1RM, reps)) * 2) / 2)); }

  // ---------- Loading ----------
  function roundTo(x, inc) { return Math.round(x / inc) * inc; }
  function plateLoad(total, bar, plates) {
    let perSide = (total - bar) / 2, out = [];
    if (perSide < 0) return { plates: [], exact: total === bar, short: 0 };
    const sorted = plates.slice().sort((a, b) => b - a);
    for (const p of sorted) { while (perSide >= p - 1e-9) { out.push(p); perSide -= p; } }
    return { plates: out, exact: perSide < 1e-9, short: perSide };
  }

  // ---------- Exercise catalog (home-gym equipment) ----------
  // tm: which TM the load comes from; mult: fraction of that TM equal to a "100%" prescription.
  // Variants must differ meaningfully from the competition lift (grip/stance >= one hand-width,
  // p.265), so each barbell variant carries a cue.
  const EX = {
    comp_squat:      { name: 'Competition Squat', tm: 'squat', mult: 1.0, load: 'bar', group: 'legs', muscles: ['quads', 'glutes'] },
    paused_squat:    { name: 'Paused Squat', tm: 'squat', mult: 0.85, load: 'bar', group: 'legs', muscles: ['quads', 'glutes'], cue: '2-count pause in the hole, stay tight, drive up' },
    tempo_squat:     { name: 'Tempo Squat', tm: 'squat', mult: 0.80, load: 'bar', group: 'legs', muscles: ['quads', 'glutes'], cue: '3 s down, no pause, normal up' },
    high_bar_squat:  { name: 'High-Bar Squat', tm: 'squat', mult: 0.88, load: 'bar', group: 'legs', muscles: ['quads', 'glutes'], cue: 'Bar on traps, upright torso, quads do the work' },
    low_bar_squat:   { name: 'Low-Bar Squat', tm: 'squat', mult: 1.0, load: 'bar', group: 'legs', muscles: ['glutes', 'hamstrings', 'quads'], cue: 'Bar on rear delts, hips back, forward lean, drive the hips up' },
    belt_squat:      { name: 'Belt Squat', tm: null, load: 'belt', group: 'legs', muscles: ['quads', 'glutes'], startHint: 'Pick a weight you could do for about 15 reps' },
    comp_bench:      { name: 'Competition Bench', tm: 'bench', mult: 1.0, load: 'bar', group: 'push', muscles: ['chest', 'triceps', 'delts'] },
    close_grip:      { name: 'Close-Grip Bench', tm: 'bench', mult: 0.90, load: 'bar', group: 'push', muscles: ['triceps', 'chest'], cue: 'Grip at least one hand-width (3-4 in) narrower than competition' },
    paused_bench:    { name: 'Long-Pause Bench', tm: 'bench', mult: 0.90, load: 'bar', group: 'push', muscles: ['chest', 'triceps'], cue: '3-count pause on the chest, stay tight' },
    spoto_press:     { name: 'Spoto Press', tm: 'bench', mult: 0.90, load: 'bar', group: 'push', muscles: ['chest', 'triceps'], cue: 'Pause 1 in off the chest for 2 s' },
    larsen_press:    { name: 'Larsen Press', tm: 'bench', mult: 0.85, load: 'bar', group: 'push', muscles: ['chest', 'triceps'], cue: 'Legs straight out, no leg drive' },
    ohp:             { name: 'Overhead Press', tm: 'bench', mult: 0.62, load: 'bar', group: 'push', muscles: ['delts', 'triceps'] },
    db_incline:      { name: 'Incline DB Press', tm: null, load: 'db', group: 'push', muscles: ['chest', 'delts', 'triceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    db_shoulder:     { name: 'Seated DB Shoulder Press', tm: null, load: 'db', group: 'push', muscles: ['delts', 'triceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    comp_deadlift:   { name: 'Competition Deadlift', tm: 'deadlift', mult: 1.0, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'] },
    paused_deadlift: { name: 'Paused Deadlift', tm: 'deadlift', mult: 0.80, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'], cue: '2-count pause just below the knee on the way up' },
    deficit_deadlift:{ name: 'Deficit Deadlift', tm: 'deadlift', mult: 0.85, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'], cue: 'Stand on a 1-2 in plate' },
    rdl:             { name: 'Romanian Deadlift', tm: 'deadlift', mult: 0.60, load: 'bar', group: 'hinge', muscles: ['hamstrings', 'glutes', 'back'], cue: 'Soft knees, hips back, bar to mid-shin, no bounce' },
    block_pull:      { name: 'Block Pull', tm: 'deadlift', mult: 1.05, load: 'bar', group: 'hinge', muscles: ['back', 'glutes'], cue: 'Bar just below the knee' },
    lat_pulldown:    { name: 'Lat Pulldown', tm: null, load: 'machine', group: 'pull', muscles: ['back', 'biceps'], startHint: 'About a 12-rep weight' },
    low_row:         { name: 'Low Row', tm: null, load: 'machine', group: 'pull', muscles: ['back', 'biceps'], startHint: 'About a 12-rep weight' },
    db_row:          { name: 'Chest-Supported DB Row', tm: null, load: 'db', group: 'pull', muscles: ['back', 'biceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    face_pull:       { name: 'Face Pull', tm: null, load: 'machine', group: 'pull', muscles: ['rear delts', 'back'], startHint: 'Light, about a 15-rep weight (pulldown station)' },
    leg_curl:        { name: 'Seated Leg Curl', tm: null, load: 'machine', group: 'legs', muscles: ['hamstrings'], startHint: 'About a 12-rep weight' },
    leg_ext:         { name: 'Leg Extension', tm: null, load: 'machine', group: 'legs', muscles: ['quads'], startHint: 'About a 12-rep weight' },
    split_squat:     { name: 'DB Split Squat', tm: null, load: 'db', group: 'legs', muscles: ['quads', 'glutes'], startHint: 'Per dumbbell, about a 12-rep weight' },
    tri_pushdown:    { name: 'Triceps Pushdown', tm: null, load: 'machine', group: 'arms', muscles: ['triceps'], startHint: 'About a 12-rep weight (pulldown station)' },
    db_oh_tri:       { name: 'DB Overhead Triceps Extension', tm: null, load: 'db', group: 'arms', muscles: ['triceps'], startHint: 'One dumbbell, about a 12-rep weight' },
    db_curl:         { name: 'DB Curl', tm: null, load: 'db', group: 'arms', muscles: ['biceps'], startHint: 'Per dumbbell, about a 12-rep weight' },
    machine_curl:    { name: 'Low-Row Station Curl', tm: null, load: 'machine', group: 'arms', muscles: ['biceps'], startHint: 'About a 12-rep weight' },
    lateral_raise:   { name: 'DB Lateral Raise', tm: null, load: 'db', group: 'arms', muscles: ['delts'], startHint: 'Per dumbbell, about a 15-rep weight' },
    hanging_raise:   { name: 'Hanging Knee Raise', tm: null, load: 'bw', group: 'core', muscles: ['abs'] },
    cable_crunch:    { name: 'Pulldown Crunch', tm: null, load: 'machine', group: 'core', muscles: ['abs'], startHint: 'About a 15-rep weight' },
  };

  // Which exercises may fill each slot (first = default when the block names none).
  const SWAPS = {
    squat_primary: ['comp_squat'],
    bench_primary: ['comp_bench'],
    deadlift_primary: ['comp_deadlift'],
    bench_secondary: ['comp_bench', 'spoto_press', 'larsen_press', 'paused_bench'],
    squat_variation: ['belt_squat', 'paused_squat', 'tempo_squat', 'high_bar_squat', 'low_bar_squat', 'comp_squat'],
    bench_variation: ['close_grip', 'paused_bench', 'spoto_press', 'larsen_press', 'comp_bench'],
    hinge_variation: ['rdl', 'paused_deadlift', 'deficit_deadlift', 'block_pull', 'comp_deadlift'],
    press_secondary: ['ohp', 'db_shoulder', 'db_incline'],
    hamstrings: ['leg_curl', 'rdl'],
    quads: ['leg_ext', 'belt_squat', 'split_squat'],
    back_vertical: ['lat_pulldown', 'db_row'],
    back_horizontal: ['low_row', 'db_row', 'lat_pulldown'],
    rear_delts: ['face_pull', 'lateral_raise'],
    triceps: ['tri_pushdown', 'db_oh_tri'],
    biceps: ['db_curl', 'machine_curl'],
    delts: ['lateral_raise', 'face_pull'],
    abs: ['hanging_raise', 'cable_crunch'],
  };

  // ---------- Blocks ----------
  // pct is of (TM x exercise mult). With TM = 90% 1RM:
  //   Build:    primaries 70-77% 1RM for 7-8 reps (hypertrophy zone 60-75%, 6-10 reps; pp.17, 338)
  //   Strength: primaries 76-86% 1RM for 3-5 reps (75-90%, 3-6 reps; pp.18, 62, 339)
  //   Peak:     primaries 85-90% for 1-3 reps, then a test week (p.340)
  // Week-to-week: +2.5-3% load and 0-1 set in Build, load only in Strength (pp.79-82, 338-339).
  const BLOCKS = [
    {
      id: 'build', name: 'Build', focus: 'Muscle and work capacity', weeks: 4, deload: true,
      primary:   [{ sets: 3, reps: 8, pct: 0.775 }, { sets: 4, reps: 8, pct: 0.80 }, { sets: 4, reps: 8, pct: 0.825 }, { sets: 4, reps: 7, pct: 0.85 }],
      secondary: [{ sets: 3, reps: 8, pct: 0.75 }, { sets: 3, reps: 8, pct: 0.775 }, { sets: 4, reps: 8, pct: 0.80 }, { sets: 4, reps: 8, pct: 0.825 }],
      accessory: [{ sets: 2, reps: 12 }, { sets: 3, reps: 12 }, { sets: 3, reps: 12 }, { sets: 3, reps: 12 }],
      plus: 2, light: { vol: 0.5, int: 0.9 }, deloadA: { vol: 0.5, int: 0.9 }, deloadB: { vol: 0.5, int: 0.5 },
      variation: { squat_variation: 'belt_squat', bench_variation: 'close_grip', hinge_variation: 'rdl' },
    },
    {
      id: 'strength', name: 'Strength', focus: 'Heavier, fewer reps', weeks: 3, deload: true,
      primary:   [{ sets: 4, reps: 5, pct: 0.85 }, { sets: 4, reps: 4, pct: 0.90 }, { sets: 4, reps: 3, pct: 0.95 }],
      secondary: [{ sets: 3, reps: 5, pct: 0.80 }, { sets: 3, reps: 5, pct: 0.83 }, { sets: 3, reps: 4, pct: 0.86 }],
      accessory: [{ sets: 2, reps: 10 }, { sets: 3, reps: 10 }, { sets: 3, reps: 8 }],
      plus: 1, light: { vol: 0.7, int: 0.7 }, deloadA: { vol: 0.7, int: 0.7 }, deloadB: { vol: 0.5, int: 0.5 },
      variation: { squat_variation: 'paused_squat', bench_variation: 'paused_bench', hinge_variation: 'paused_deadlift' },
    },
    {
      id: 'peak', name: 'Peak & Test', focus: 'Express strength, set new maxes', weeks: 2, deload: false, test: true,
      primary:   [{ sets: 3, reps: 3, pct: 0.95 }, { sets: 3, reps: 2, pct: 1.0 }],
      secondary: [{ sets: 3, reps: 4, pct: 0.80 }, { sets: 2, reps: 3, pct: 0.80 }],
      accessory: [{ sets: 2, reps: 10 }, { sets: 1, reps: 10 }],
      plus: 0, light: { vol: 0.9, int: 0.5 }, deloadA: { vol: 0.9, int: 0.5 }, deloadB: { vol: 0.5, int: 0.5 },
      variation: { squat_variation: 'comp_squat', bench_variation: 'comp_bench', hinge_variation: 'comp_deadlift' },
    },
  ];
  // Active rest: 50% volume / 50% intensity, non-competition lifts (pp.155, 343).
  const REST = { primary: { sets: 2, reps: 5, pct: 0.50 }, secondary: { sets: 2, reps: 6, pct: 0.50 }, accessory: { sets: 2, reps: 12 },
    variation: { squat_primary: 'high_bar_squat', bench_primary: 'close_grip', deadlift_primary: 'paused_deadlift', bench_secondary: 'spoto_press', squat_variation: 'tempo_squat', bench_variation: 'larsen_press', hinge_variation: 'rdl' } };
  const TEST = { warmups: [{ reps: 5, pct: 0.55 }, { reps: 3, pct: 0.70 }, { reps: 2, pct: 0.80 }, { reps: 1, pct: 0.90 }, { reps: 1, pct: 0.97 }, { reps: 1, pct: 1.03 }], backoff: { sets: 2, reps: 3, pct: 0.80 } };

  // Hard weekly caps on working sets for each competition pattern (comp lift + barbell variants).
  // Set additions can never climb past these, so the volume that buried you stays out of reach.
  const CAPS = { squat: 12, bench: 16, deadlift: 9 };
  const ACC_CAP = 4;

  // ---------- Four-day layout ----------
  // Squat 2x, bench muscles 3x (one overload), deadlift heavy 1x + a hinge variant (pp.219-220).
  const DAYS = [
    { id: 'A', name: 'Squat day', slots: [
      { key: 'squat_primary', role: 'primary', tm: 'squat' },
      { key: 'bench_secondary', role: 'secondary', tm: 'bench' },
      { key: 'hamstrings', role: 'accessory' },
      { key: 'back_vertical', role: 'accessory' },
      { key: 'abs', role: 'accessory', optional: true }] },
    { id: 'B', name: 'Bench day', slots: [
      { key: 'bench_primary', role: 'primary', tm: 'bench' },
      { key: 'press_secondary', role: 'secondary', tm: 'bench' },
      { key: 'back_horizontal', role: 'accessory' },
      { key: 'triceps', role: 'accessory' },
      { key: 'biceps', role: 'accessory', optional: true }] },
    { id: 'C', name: 'Deadlift day', slots: [
      { key: 'deadlift_primary', role: 'primary', tm: 'deadlift' },
      { key: 'squat_variation', role: 'secondary', tm: 'squat' },
      { key: 'quads', role: 'accessory' },
      { key: 'rear_delts', role: 'accessory' },
      { key: 'abs', role: 'accessory', optional: true }] },
    { id: 'D', name: 'Bench variation day', slots: [
      { key: 'bench_variation', role: 'secondary', tm: 'bench' },
      { key: 'hinge_variation', role: 'secondary', tm: 'deadlift' },
      { key: 'back_vertical', role: 'accessory' },
      { key: 'delts', role: 'accessory', optional: true },
      { key: 'triceps', role: 'accessory' }] },
  ];

  // ---------- Readiness ----------
  // sleep, energy, motivation: 1 (worst) .. 5 (best). soreness: 1 (fresh) .. 5 (wrecked).
  function readinessScore(r) {
    const s = (v) => (v - 1) / 4;
    const score = 100 * (0.30 * s(r.sleep) + 0.25 * s(r.energy) + 0.25 * (1 - s(r.soreness)) + 0.20 * s(r.motivation));
    const color = score >= 60 ? 'green' : score >= 40 ? 'yellow' : 'red';
    return { score: Math.round(score), color };
  }
  // Soreness by muscle group (1 none .. 4 very sore) -> the 1..5 soreness answer.
  function sorenessFromGroups(g) {
    const m = Math.max(g.legs || 1, g.push || 1, g.hinge || 1);
    return { 1: 1, 2: 2.5, 3: 4, 4: 5 }[m] || 1;
  }
  // Modes. 'full' = the plan. 'trim' (yellow) keeps the loads (most so-so days still allow an
  // overload, p.96) but drops bonus reps and any earned set additions. 'light' (red) is the
  // book's light session for the block: volume and intensity as fractions of the overload day
  // (pp.148-149). Light beats a day off for both fatigue and fitness (p.179).
  const MODES = { full: { label: 'As planned' }, trim: { label: 'Trimmed' }, light: { label: 'Light session' } };

  // ---------- Session generation ----------
  function tmOf(state, lift) { return state.lifts[lift].tm; }
  // The "other" bar position is the variation: high-bar for a low-bar competitor and vice versa.
  function otherSquat(state) { return state.settings.squatStyle === 'highbar' ? 'low_bar_squat' : 'high_bar_squat'; }
  function resolveExercise(state, slot, block, rest) {
    const sw = state.program.swaps || {};
    let id;
    if (sw[slot.key]) id = sw[slot.key];
    else if (rest && REST.variation[slot.key]) id = REST.variation[slot.key];
    else if (block.variation && block.variation[slot.key]) id = block.variation[slot.key];
    else id = SWAPS[slot.key][0];
    if (id === 'high_bar_squat' || id === 'low_bar_squat') id = otherSquat(state);
    return id;
  }
  function exerciseName(state, exId) {
    if (exId === 'comp_squat') return `Competition Squat (${state.settings.squatStyle === 'highbar' ? 'high-bar' : 'low-bar'})`;
    if (exId === 'comp_deadlift') return `Competition Deadlift (${state.settings.deadliftStyle === 'sumo' ? 'sumo' : 'conventional'})`;
    return EX[exId].name;
  }
  // Swap choices for a slot, hiding the bar position that is already the competition squat.
  function swapOptions(state, slotKey) {
    const hide = state.settings.squatStyle === 'highbar' ? 'high_bar_squat' : 'low_bar_squat';
    return (SWAPS[slotKey] || []).filter(x => x !== hide);
  }
  function accWeight(state, ex) { const a = (state.acc || {})[ex]; return a && a.weight != null ? a.weight : null; }
  function position(state) {
    const P = state.program, block = BLOCKS[P.blockIdx];
    const rest = P.special && P.special.type === 'rest';
    const isDeload = !rest && block.deload && P.week > block.weeks;
    const isTest = !rest && block.test && P.week > block.weeks;
    return { block, rest, isDeload, isTest, wk: Math.min(P.week, block.weeks) - 1, day: DAYS[P.dayIdx] };
  }

  function buildSession(state, mode) {
    const P = state.program, S = state.settings;
    const { block, rest, isDeload, isTest, wk, day } = position(state);
    mode = MODES[mode] ? mode : 'full';
    const out = { block: rest ? 'rest' : block.id, blockName: rest ? 'Easy week' : block.name, week: P.week, isDeload, isTest, isRest: rest, dayId: day.id, dayName: day.name, mode, exercises: [], notes: [] };
    const firstHalf = P.dayIdx < 2;
    const lastWk = block.weeks - 1;

    for (const slot of day.slots) {
      const exId = resolveExercise(state, slot, block, rest);
      const ex = EX[exId], lift = slot.tm || null;
      const item = { slotKey: slot.key, ex: exId, name: exerciseName(state, exId), role: slot.role, lift, load: ex.load, optional: !!slot.optional, cue: ex.cue || null, sets: [],
        rest: slot.role === 'primary' ? S.restPrimary : slot.role === 'secondary' ? S.restSecondary : S.restAccessory };

      // --- Test week: primaries work up to a heavy single ---
      if (isTest && slot.role === 'primary') {
        const tm = tmOf(state, lift);
        for (const w of TEST.warmups) item.sets.push({ w: roundTo(tm * w.pct, S.increment), reps: w.reps, pct: w.pct, kind: w.pct >= 0.97 ? 'test' : 'warm', rpeTarget: w.pct >= 1.03 ? 9 : w.pct >= 0.97 ? 8 : null });
        item.sets.push({ w: null, reps: 1, pct: null, kind: 'test', rpeTarget: 9, open: true });
        for (let i = 0; i < TEST.backoff.sets; i++) item.sets.push({ w: roundTo(tm * TEST.backoff.pct, S.increment), reps: TEST.backoff.reps, pct: TEST.backoff.pct, kind: 'work', rpeTarget: 7 });
        item.note = 'Work up to one single at RPE 9 (one clean rep left). Add 2-5% to the last line if the single before it was RPE 8 or less. Stop there, then do the back-off sets.';
        out.exercises.push(item);
        continue;
      }

      if (ex.tm) {
        // ----- Barbell lift loaded from a TM -----
        let base, volF = 1, intF = 1, why = null;
        if (rest) { base = REST[slot.role]; }
        else if (isDeload || isTest) {
          base = block[slot.role][lastWk];
          const d = firstHalf ? block.deloadA : block.deloadB; volF = d.vol; intF = d.int;
          if (isTest) { volF = 0.5; intF = 0.7; }
        } else {
          base = block[slot.role][wk];
          if (mode === 'light') { volF = block.light.vol; intF = block.light.int; }
        }
        const adj = (!rest && !isDeload && !isTest) ? ((P.loadAdj && P.loadAdj[lift]) || 0) : 0;
        let sets = base.sets;
        if (!rest && !isDeload && !isTest && mode === 'full') sets += ((P.setAdj && P.setAdj[lift]) || 0);
        sets = Math.max(1, Math.round(sets * volF + 1e-9));
        if (volF < 1 && sets < 2 && base.sets >= 3) sets = 2;
        const pct = (base.pct + adj) * intF;
        const w = roundTo(tmOf(state, lift) * ex.mult * pct, S.increment);
        const pct1rm = w / (state.lifts[lift].oneRM * ex.mult);
        const rpe = plannedRPE(pct1rm, base.reps);
        const plusOk = mode === 'full' && !isDeload && !isTest && !rest && block.plus > 0;
        if (S.warmupSets !== false) for (const st of warmups(Math.max(w, S.barWeight), S.barWeight, S.increment, slot.role)) item.sets.push({ w: st.w, reps: st.reps, kind: 'warm' });
        for (let i = 0; i < sets; i++) {
          const ind = i === 0 && plusOk;
          item.sets.push({ w, reps: base.reps, pct, kind: 'work', ind, plus: ind ? block.plus : 0, rpeTarget: rpe });
        }
        item.pctTM = pct; item.rpeTarget = rpe;
        if (w < S.barWeight) item.sets.forEach(x => x.w = S.barWeight);
      } else {
        // ----- Self-loaded (belt squat, dumbbells, machines): double progression -----
        let sch, volF = 1, intF = 1;
        if (rest) { sch = REST.accessory; intF = 0.8; }
        else if (isDeload || isTest) { sch = block.accessory[lastWk]; volF = 0.5; intF = firstHalf && !isTest ? 0.9 : 0.7; }
        else {
          const s = block[slot.role][wk];
          sch = slot.role === 'accessory' ? s : { sets: s.sets, reps: Math.max(8, s.reps + 2) };
          if (mode === 'light') { volF = block.light.vol; intF = Math.max(0.7, block.light.int); }
        }
        let sets = sch.sets + ((!rest && !isDeload && !isTest && mode === 'full' && P.setAdj && P.setAdj.acc) || 0);
        sets = Math.max(1, Math.min(ACC_CAP, Math.round(sets * volF + 1e-9)));
        const w0 = accWeight(state, exId);
        const w = w0 == null ? null : ex.load === 'bw' ? null : roundTo(w0 * intF, ex.load === 'db' ? S.dbIncrement : 5);
        for (let i = 0; i < sets; i++) item.sets.push({ w, reps: sch.reps, kind: 'work', rpeTarget: 8 });
        item.repRange = [sch.reps, sch.reps + 3];
        item.needsWeight = w0 == null && ex.load !== 'bw';
        item.startHint = ex.startHint;
      }
      out.exercises.push(item);
    }
    const cardioF = mode === 'light' ? 0.5 : 1;
    out.cardioMin = Math.round(S.cardioMin * cardioF);
    out.estMinutes = estimateMinutes(out);
    if (isDeload) out.notes.push(firstHalf ? 'Deload, first half: half the sets, loads kept high so nothing detrains.' : 'Deload, second half: half the sets at half the load. It is meant to feel easy.');
    if (rest) out.notes.push('Active rest: everything at about half volume and half load, on variations. Technique practice, not work.');
    return out;
  }

  function estimateMinutes(sess) {
    let s = 8;
    for (const e of sess.exercises) {
      const warm = e.sets.filter(x => x.kind === 'warm').length, n = e.sets.length - warm;
      s += n * (e.rest / 60 + 0.75) + warm * 1.1 + (warm ? 0.5 : e.role === 'primary' ? 5 : e.role === 'secondary' ? 3 : 1);
    }
    return Math.round(s);
  }

  // Warm-up ramp to the first working weight. Fractions are of the WORKING weight, not the 1RM:
  // reps fall as load rises, jumps shrink near the top, and the last step is a single at ~90% so
  // the first work set is not a surprise. A heavier target earns more steps; the second barbell
  // lift of a session (already warm) gets a shorter ramp. Steps closer than 10 lb are dropped.
  function warmups(target, bar, increment, role) {
    const steps = [{ w: bar, reps: role === 'primary' ? 10 : 8 }];
    if (target <= bar + 20) return steps;
    const full = target >= 300 ? [[0.35, 8], [0.5, 5], [0.62, 4], [0.72, 3], [0.82, 2], [0.9, 1]]
      : target >= bar * 3 ? [[0.4, 8], [0.55, 5], [0.7, 3], [0.82, 2], [0.9, 1]]
      : [[0.5, 5], [0.7, 3], [0.85, 1]];
    const short = target >= bar * 3 ? [[0.5, 5], [0.7, 3], [0.85, 1]] : [[0.6, 4], [0.8, 2]];
    const ramp = role === 'primary' ? full : short;
    let last = bar;
    for (const [r, reps] of ramp) {
      const w = roundTo(target * r, increment);
      if (w >= last + 10 && w <= target - 10) { steps.push({ w, reps }); last = w; }
    }
    return steps;
  }

  // ---------- In-session correction (what a coach does between sets) ----------
  // evidence: the done working sets so far [{w, reps, rpe, first}]. A missed set is RPE 10 at the
  // reps achieved; bonus reps count as reps. Each set implies a 1RM via the rep-max table; the
  // weight that would land the planned reps at the target RPE comes back from the same table.
  // Confidence: the first set alone counts half (it often feels heaviest for reasons that are not
  // fitness); sets below RPE 6 are too far from failure to say much and count half too.
  function liftCorrection(evidence, plannedW, reps, targetRPE, caps) {
    caps = caps || { down: 0.85, up: 1.05 };

  // ---------- Rest timer (persisted, so closing the app mid-rest loses nothing) ----------
  function startTimer(seconds, label) {

    const left = Math.ceil((ui.timer.end - Date.now()) / 1000);

    el.classList.toggle('over', left <= 0);
    const a = Math.abs(left), txt = left <= 0 ? `Rest done ${a >= 60 ? '+' + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0') : '+' + a + 's'}` : `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    el.innerHTML = `<span>${txt}</span><button data-action="timer-add">+30s</button><button data-action="timer-stop">Done</button>`;

      for (const e of s.exercises) if (e.lift === l && E.EX[e.ex].mult === 1) for (const x of e.sets) if (x.done && x.rpe != null && x.rpe >= 7 && x.kind !== 'warm') { const w = x.actualW != null ? x.actualW : x.w, r = x.actualReps != null ? x.actualReps : x.reps; if (w && r) best = Math.max(best, E.e1rm(w, r, x.rpe)); }

  }

  // ---------- Cardio ----------
  function renderCardio() {

    const run = ui.cardioRun;

  // ---------- Completing a session, reviews ----------

  }

  // ---------- History ----------
  function renderHistory() {
    const done = state.sessions.filter(s => !s.skipped).slice().reverse();
    const trend = LIFTS.map(l => { const w = weeklyEst(l); const last = w[w.length - 1], prev = w[w.length - 2]; return `<div class="stack"><div class="row between"><b>${LIFTNAME[l]}</b><span class="small muted num">1RM ${state.lifts[l].oneRM} · TM ${state.lifts[l].tm}${last ? ` · this week ~${Math.round(last.y)}${prev ? ` (${last.y >= prev.y ? '+' : ''}${Math.round(last.y - prev.y)} vs last)` : ''}` : ''}</span></div><canvas id="c-${l}" height="130"></canvas></div>`; }).join('');
    return `
      <div class="card"><h3>Estimated 1RM, week by week</h3>${trend}<div class="row small muted" style="gap:14px"><span><span class="dot" style="background:var(--accent)"></span> weekly average</span><span><span class="dot" style="background:var(--muted)"></span> single sessions</span><span>dashed: current 1RM</span></div><p class="small muted">Every logged set with an RPE on a competition lift (or a close barbell variation) implies a max; the line is the weekly average of those. It moves with how you are doing and feeling, not with what you entered at setup.</p></div>
      <div class="card"><h3>Readiness</h3><canvas id="c-ready" height="140"></canvas></div>
      <div class="card"><h3>Sessions</h3>${done.length ? done.slice(0, 60).map((s, i) => `<details class="session-item" style="display:block"><summary class="row between"><div><b>${esc(s.dayName)}</b> <span class="muted small">${fmtDate(s.date)} · ${esc(s.blockName || '')} wk ${s.week}${s.mode && s.mode !== 'full' ? ' · ' + E.MODES[s.mode].label : ''}</span></div><div class="row" style="gap:6px">${s.readiness ? `<span class="pill ${s.readiness.color}">${s.readiness.score}</span>` : ''}${s.post ? `<span class="pill">${DIFF[s.post.difficulty]}</span>` : ''}</div></summary>
          <div class="tablewrap" style="margin-top:8px"><table>${s.exercises.map(e => `<tr><td>${esc(e.name)}</td><td class="small num">${e.sets.filter(x => x.done && x.kind !== 'warm').map(x =>`${x.actualW != null ? x.actualW : (x.w != null ? x.w : 'bw')}×${x.actualReps != null ? x.actualReps : x.reps}${x.rpe != null ? '@' + x.rpe : ''}`).join(', ') || '<span class="muted">skipped</span>'}</td></tr>`).join('')}</table></div>
          <div class="small muted" style="margin-top:6px">${s.durationMin ? s.durationMin + ' min' : ''}${s.cardio && s.cardio.min ? ` · bike ${s.cardio.min} min` : ''}${s.notes ? ' · ' + esc(s.notes) : ''}</div>
          <button class="btn sm quiet" data-action="delete-session" data-id="${s.id}" style="margin-top:6px;color:var(--bad)">Delete</button></details>`).join('') : '<p class="empty">No sessions yet. Your first check-in is on the Today tab.</p>'}</div>`;
  }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  // Per-session max estimates (confidence-weighted) and their weekly averages.
  function sessionEsts(lift) {
    const out = [];
    for (const s of state.sessions) { if (s.skipped || s.isDeload || s.isRest) continue; const r = E.sessionEstimate(s, lift); if (r) out.push({ x: s.ts, y: r.est, conf: r.conf }); }
    return out;
  }
  function weekStart(ts) { const d = new Date(ts); const day = (d.getDay() + 6) % 7; d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - day); return d.getTime(); }
  function weeklyEst(lift) {
    const by = {};
    for (const p of sessionEsts(lift)) { const k = weekStart(p.x); by[k] = by[k] || { n: 0, d: 0 }; by[k].n += p.y * p.conf; by[k].d += p.conf; }
    return Object.keys(by).map(Number).sort((a, b) => a - b).map(k => ({ x: k + 3.5 * 864e5, y: by[k].n / by[k].d }));
  }
  function drawCharts() {
    const ready = [];
    for (const s of state.sessions) if (!s.skipped && s.readiness) ready.push({ x: s.ts, y: s.readiness.score, c: s.readiness.color });
    for (const l of LIFTS) {
      const sess = sessionEsts(l), weekly = weeklyEst(l);
      lineChart($('#c-' + l), [{ pts: sess, color: cssVar('--muted'), dots: true, noline: true, faint: true }, { pts: weekly, color: cssVar('--accent'), dots: true }], { hline: state.lifts[l].oneRM, hlineColor: cssVar('--fg') });
    }
    lineChart($('#c-ready'), [{ pts: ready, color: cssVar('--accent'), dots: true }], { min: 0, max: 100, bands: [[0, 40, cssVar('--bad-soft')], [40, 60, cssVar('--warn-soft')], [60, 100, cssVar('--good-soft')]] });
  }
  function lineChart(cv, series, opt) {
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 320, H = Number(cv.getAttribute('height'));
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const all = series.flatMap(s => s.pts);
    const padL = 40, padR = 10, padT = 10, padB = 22;
    ctx.font = '11px ' + cssVar('--body'); ctx.fillStyle = cssVar('--muted'); ctx.strokeStyle = cssVar('--line');
    if (!all.length) { ctx.fillText(opt.hline ? `No logged sets yet. Current 1RM ${opt.hline}.` : 'No data yet', padL, H / 2); return; }
    let xs = all.map(p => p.x), ys = all.map(p => p.y).concat(opt.hline ? [opt.hline] : []);
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
    let y0 = opt.min != null ? opt.min : Math.min(...ys), y1 = opt.max != null ? opt.max : Math.max(...ys);
    if (opt.min == null) { const r = Math.max(10, (y1 - y0) * 0.15); y0 = Math.floor((y0 - r) / 10) * 10; y1 = Math.ceil((y1 + r) / 10) * 10; }
    const X = x => padL + (x - x0) / (x1 - x0) * (W - padL - padR), Y = y => padT + (1 - (y - y0) / (y1 - y0)) * (H - padT - padB);
    if (opt.bands) for (const [a, b, c] of opt.bands) { ctx.fillStyle = c; ctx.fillRect(padL, Y(b), W - padL - padR, Y(a) - Y(b)); }
    ctx.fillStyle = cssVar('--muted');
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) { const y = y0 + (y1 - y0) * i / ticks; ctx.beginPath(); ctx.moveTo(padL, Y(y)); ctx.lineTo(W - padR, Y(y)); ctx.stroke(); ctx.fillText(Math.round(y), 4, Y(y) + 4); }
    const d0 = new Date(x0), d1 = new Date(x1); ctx.fillText(d0.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), padL, H - 6); const t = d1.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); ctx.fillText(t, W - padR - ctx.measureText(t).width, H - 6);
    if (opt.hline != null) { ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = opt.hlineColor || cssVar('--fg'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(padL, Y(opt.hline)); ctx.lineTo(W - padR, Y(opt.hline)); ctx.stroke(); ctx.restore(); }
    for (const s of series) {
      if (!s.pts.length) continue;
      ctx.globalAlpha = s.faint ? 0.45 : 1;
      if (!s.noline) { ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y))); ctx.stroke(); }
      ctx.fillStyle = s.color;
      s.pts.forEach((p, i) => { if (s.dots || i === s.pts.length - 1) { ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), s.faint ? 2.5 : 3.5, 0, Math.PI * 2); ctx.fill(); } });
      if (!s.faint) { const last = s.pts[s.pts.length - 1]; ctx.fillText(Math.round(last.y), Math.min(W - padR - 28, X(last.x) + 6), Y(last.y) - 6); }
      ctx.globalAlpha = 1;
    }
  }

      </div>
      <div class="card"><h3>Equipment</h3>
        <div class="grid2"><label class="f">Bar weight<input id="set-bar" type="number" data-setting="barWeight" value="${s.barWeight}"></label><label class="f">Dumbbell step<select id="set-dbi" data-setting="dbIncrement"><option value="2.5" ${s.dbIncrement == 2.5 ? 'selected' : ''}>2.5</option><option value="5" ${s.dbIncrement == 5 ? 'selected' : ''}>5</option></select></label></div>
        <div class="stack"><span class="tiny">Plates per side</span><div class="chips">${[55, 45, 35, 25, 15, 10, 5, 2.5, 1.25].map(p => `<button data-action="set-plate" data-p="${p}" aria-pressed="${s.plates.includes(p)}">${p}</button>`).join('')}</div></div>
        <div class="stack"><span class="tiny">Accessory working weights</span><div class="tablewrap"><table>${Object.keys(state.acc).length ? Object.keys(state.acc).map(k => `<tr><td>${esc(E.EX[k] ? E.EX[k].name : k)}</td><td class="num"><input id="acc-${k}" type="number" inputmode="decimal" data-setting="acc:${k}" value="${state.acc[k].weight}" style="width:80px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)"></td></tr>`).join('') : '<tr><td class="muted small">They appear here once you enter them in a session.</td></tr>'}</table></div></div>
      </div>
      <div class="card"><h3>Schedule and cardio</h3>
        <div class="stack"><span class="tiny">Training days</span><div class="chips">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<button data-action="set-day" data-d="${x}" aria-pressed="${s.days.includes(x)}">${x}</button>`).join('')}</div></div>
        <div class="grid2"><label class="f">Bike after lifting (min)<input id="set-cm" type="number" data-setting="cardioMin" value="${s.cardioMin}"></label><label class="f">Usual easy watts<input id="set-cw" type="number" data-setting="cardioWatts" value="${s.cardioWatts}"></label></div>
        <div class="grid3"><label class="f">Rest, main (s)<input id="set-r1" type="number" data-setting="restPrimary" value="${s.restPrimary}"></label><label class="f">Rest, second (s)<input id="set-r2" type="number" data-setting="restSecondary" value="${s.restSecondary}"></label><label class="f">Rest, accessory (s)<input id="set-r3" type="number" data-setting="restAccessory" value="${s.restAccessory}"></label></div>
        <label class="row" style="gap:10px;font-weight:600"><input type="checkbox" id="set-peak" data-setting="includePeak" ${s.includePeak !== false ? 'checked' : ''} style="width:22px;height:22px"> Include the Peak &amp; Test block</label>
        <label class="row" style="gap:10px;font-weight:600"><input type="checkbox" id="set-warm" data-setting="warmupSets" ${s.warmupSets !== false ? 'checked' : ''} style="width:22px;height:22px"> Show warm-up sets in each session</label>
        <label class="row" style="gap:10px;font-weight:600"><input type="checkbox" id="set-notify" data-setting="notify" ${s.notify ? 'checked' : ''} style="width:22px;height:22px"> Notify me when a rest ends <span class="muted small" style="font-weight:500">(iPhone: only from the home-screen app, and only while it is still running)</span></label>
        <label class="f">Extra easy cardio today (min, off-day bike or walk)<div class="row"><input id="extra-cardio" type="number" inputmode="numeric" placeholder="30" style="flex:1"><button class="btn sm" data-action="extra-cardio">Log</button></div></label>
      </div>
      <div class="card"><h3>Data</h3>
        <p class="small muted">${Store.db ? 'Synced to your Claude account, so it follows you across devices.' : 'Stored in this browser only. Export now and then as a backup.'}</p>
        <div class="btnrow"><button class="btn" data-action="export">Copy backup</button><button class="btn" data-action="import-toggle">Restore from backup</button></div>
        ${ui.importText != null && ui.showImport ? `<label class="f">Paste a backup<textarea id="import-text" rows="4"></textarea></label><button class="btn primary" data-action="import">Restore</button>` : ''}
        <button class="btn danger block" data-action="reset-confirm">Start over</button>
        ${ui.confirm === 'reset' ? `<div class="callout bad">This erases the program and every logged session, and it cannot be undone. Tap Copy backup first if there is anything worth keeping. <div class="btnrow" style="margin-top:8px"><button class="btn sm danger" data-action="reset">Erase everything</button><button class="btn sm" data-action="confirm-cancel">Cancel</button></div></div>` : ''}
      </div>
      <p class="small muted" style="text-align:center">Readyset · principles from Israetel, Hoffmann &amp; Smith, Scientific Principles of Strength Training (2020). Not medical advice.</p>`;
  }
  function applySetting(key, val) {
    const s = state.settings;
    if (key.startsWith('1rm:')) { const l = key.split(':')[1]; if (Number(val) > 0) { E.applyTM(state, l, Number(val)); state.lifts[l].est = null; state.lifts[l].blockStartRM = Number(val); addLog(`${LIFTNAME[l]} 1RM set to ${Number(val)} by hand.`); rebaseSession(); } }
    else if (key === 'tmPct') { s.tmPct = Number(val); LIFTS.forEach(l => E.applyTM(state, l, state.lifts[l].oneRM)); rebaseSession(); }
    else if (key === 'autoCalibrate') s.autoCalibrate = !!val;
    else if (key.startsWith('acc:')) { const k = key.split(':')[1]; state.acc[k] = { weight: Number(val), updated: todayISO() }; }
    else if (key === 'includePeak') s.includePeak = !!val;
    else if (key === 'warmupSets') s.warmupSets = !!val;
    else if (key === 'notify') { if (val) enableNotify(); else s.notify = false; }
    else if (key === 'squatStyle' || key === 'deadliftStyle') s[key] = val;
    else if (['barWeight', 'dbIncrement', 'cardioMin', 'cardioWatts', 'restPrimary', 'restSecondary', 'restAccessory'].includes(key)) s[key] = Number(val);
    save();
  }

  // ---------- Events ----------
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-action],[data-view]');
    if (!t) return;
    if (t.dataset.view) { view = t.dataset.view; ui.confirm = null; render(); window.scrollTo(0, 0); return; }
    const a = t.dataset.action, d = t.dataset;
    if (t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
    switch (a) {
      case 'setup-next': if (ui.setupStep === 1) { const bad = LIFTS.filter(l => !(Number(draft()[l]) > 0)); if (bad.length) { toast(`Enter a ${LIFTNAME[bad[0]]} max`); return; } } ui.setupStep++; render(); window.scrollTo(0, 0); break;
      case 'setup-back': ui.setupStep = Math.max(0, ui.setupStep - 1); render(); break;
      case 'setup-calc': { const dr = draft(); dr.calc[d.lift] = dr.calc[d.lift] ? null : {}; render(); break; }
      case 'setup-apply-calc': { const dr = draft(), c = dr.calc[d.lift] || {}; const w = Number(c.w), r = Number(c.r), e = Number(c.e) || 8; if (w > 0 && r > 0) { dr[d.lift] = Math.round(E.e1rm(w, r, e) / 2.5) * 2.5; dr.calc[d.lift] = null; render(); } else toast('Enter weight and reps'); break; }
      case 'setup-plate': { const dr = draft(), p = Number(d.p); dr.plates = dr.plates.includes(p) ? dr.plates.filter(x => x !== p) : dr.plates.concat(p); render(); break; }
      case 'setup-day': { const dr = draft(); dr.days = dr.days.includes(d.d) ? dr.days.filter(x => x !== d.d) : dr.days.concat(d.d); render(); break; }
      case 'setup-finish': finishSetup(); break;
      case 'checkin': startCheckin(); break;
      case 'ci': { const c = ui.checkin; if (d.k.startsWith('g:')) c.groups[d.k.slice(2)] = Number(d.v); else c[d.k] = Number(d.v); render(); break; }
      case 'ci-submit': submitCheckin(); break;
      case 'ci-cancel': ui.checkin = null; render(); break;
      case 'ci-back': ui.checkin.result = null; render(); break;
      case 'ci-choice': ui.checkin.choice = d.v; render(); break;
      case 'ci-rest': restToday(); break;
      case 'start-session': startSession(d.mode); break;
      case 'skip-session': if (window.__skipArmed) { window.__skipArmed = false; skipSession(); } else { window.__skipArmed = true; toast('Tap again to skip this session'); setTimeout(() => { window.__skipArmed = false; }, 3000); } break;
      case 'done': toggleDone(Number(d.ei), Number(d.si)); break;
      case 'rpe': openRpe(Number(d.ei), Number(d.si)); break;
      case 'rpe-pick': { const { ei, si } = ui.sheet, x = state.current.exercises[ei].sets[si]; x.rpe = d.v === '' ? null : Number(d.v); ui.sheet = null; renderSheet(); if (!x.done && x.rpe != null) markDone(ei, si); recalcExercise(ei); save(); render(); break; }
      case 'cut-sets': cutSets(Number(d.ei)); break;
      case 'restore-sets': restoreSets(Number(d.ei)); break;
      case 'sheet-close': if (ev.target === t || ev.target.closest('[data-stop]') == null || t.tagName === 'BUTTON') { ui.sheet = null; renderSheet(); } break;
      case 'toggle-skip': { const s = state.current, e = s.exercises[Number(d.ei)]; const i = s.skippedSlots.indexOf(e.slotKey); if (i >= 0) s.skippedSlots.splice(i, 1); else s.skippedSlots.push(e.slotKey); save(); render(); break; }
      case 'finish-lifting': finishLifting(false); break;
      case 'finish-confirm': finishLifting(true); break;
      case 'abandon': ui.confirm = 'abandon'; render(); break;
      case 'abandon-confirm': abandon(); break;
      case 'confirm-cancel': ui.confirm = null; render(); break;
      case 'post-diff': state.current.post.difficulty = Number(d.v); save(); render(); break;
      case 'post-next': if (!state.current.post.difficulty) { toast('Pick one'); return; } if (state.settings.cardioMin) { state.current.phase = 'cardio'; save(); render(); } else { state.current.cardio = { min: 0 }; completeSession(); } break;
      case 'cardio-start': ui.cardioRun = { start: Date.now(), pausedTotal: 0, paused: false }; keepAwake(); render(); break;
      case 'cardio-pause': ui.cardioRun.paused = true; ui.cardioRun.pausedAt = Date.now(); render(); break;
      case 'cardio-resume': ui.cardioRun.pausedTotal += Date.now() - ui.cardioRun.pausedAt; ui.cardioRun.paused = false; render(); break;
      case 'cardio-save': saveCardio(false); break;
      case 'cardio-skip': saveCardio(true); break;
      case 'timer-add': if (ui.timer) { ui.timer.end += 30000; ui.timer.fired = false; tickTimer(); } break;
      case 'timer-stop': stopTimer(); break;
      case 'dismiss-report': state.lastReport = null; save(); render(); break;
      case 'undo': undoLast(); break;
      case 'deload-now-confirm': ui.confirm = 'deload'; render(); break;
      case 'rest-now-confirm': ui.confirm = 'rest'; render(); break;
      case 'deload-now': snapshot('Deload started early'); E.startDeloadNow(state); state.program.pendingDeload = false; ui.confirm = null; addLog('Deload started early.'); save(); render(); break;
      case 'deload-later': snapshot('Deload suggestion dismissed'); state.program.pendingDeload = false; addLog('Deload suggestion declined; pushing on.'); save(); render(); break;
      case 'rest-now': snapshot('Easy week inserted'); E.startActiveRest(state, 1); ui.confirm = null; addLog('Easy week inserted.'); save(); render(); break;
      case 'set-plate': { const s = state.settings, p = Number(d.p); s.plates = (s.plates.includes(p) ? s.plates.filter(x => x !== p) : s.plates.concat(p)).sort((a, b) => b - a); s.increment = s.plates.includes(1.25) ? 2.5 : s.plates.includes(2.5) ? 5 : 10; LIFTS.forEach(l => E.applyTM(state, l, state.lifts[l].oneRM)); save(); render(); break; }
      case 'set-day': { const s = state.settings; s.days = s.days.includes(d.d) ? s.days.filter(x => x !== d.d) : s.days.concat(d.d); save(); render(); break; }
      case 'extra-cardio': { const m = Number($('#extra-cardio').value) || 0; if (m > 0) { state.extraCardio = state.extraCardio || []; state.extraCardio.push({ date: todayISO(), min: m, kcal: E.cardioKcal(m, state.settings.cardioWatts) }); save(); toast(`Logged ${m} min`); render(); } break; }
      case 'export': { const txt = JSON.stringify(state); const ok = () => toast('Backup copied. Paste it somewhere safe.'); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt)); else fallbackCopy(txt); break; }
      case 'import-toggle': ui.showImport = !ui.showImport; render(); break;
      case 'import': { try { const obj = JSON.parse($('#import-text').value); if (!obj.settings || !obj.program) throw new Error('bad'); state = obj; Store.pushAll(state); save(); ui.showImport = false; toast('Restored'); render(); } catch (e) { toast('That does not look like a Readyset backup'); } break; }
      case 'reset-confirm': ui.confirm = 'reset'; render(); break;
      case 'reset': { for (const s of state.sessions) Store.deleteSession(s.id); state = E.defaultState(); ui.confirm = null; ui.setupStep = 0; ui.draft = null; save(); render(); break; }
      case 'delete-session': { const i = state.sessions.findIndex(s => s.id === d.id); if (i >= 0) { const s = state.sessions[i]; snapshot(`Deleted ${s.dayName} (${fmtDate(s.date)})`, { restoreSession: s }); state.sessions.splice(i, 1); Store.deleteSession(d.id); save(); render(); } break; }
    }
  });
  function fallbackCopy(txt) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Backup copied'); } catch (e) { toast('Copy failed; select and copy manually'); } ta.remove(); }
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.draft) { const dr = draft(); dr[t.dataset.draft] = t.type === 'checkbox' ? t.checked : t.value; return; }
    if (t.dataset.calc) { const [l, k] = t.dataset.calc.split(':'); const dr = draft(); dr.calc[l] = dr.calc[l] || {}; dr.calc[l][k] = t.value; return; }
    if (t.dataset.set) { setField(Number(t.dataset.ei), Number(t.dataset.si), t.dataset.set, t.value); return; }
    if (t.dataset.setting) { applySetting(t.dataset.setting, t.type === 'checkbox' ? t.checked : t.value); render(); return; }
    if (t.dataset.action === 'swap') { swapExercise(Number(t.dataset.ei), t.value); return; }
    if (t.dataset.action === 'notes') { state.current.notes = t.value; save(); return; }
    if (t.dataset.action === 'next-block') { state.program.nextBlockOverride = t.value === '' ? null : Number(t.value); save(); return; }
    if (t.dataset.action === 'pin-swap') { if (t.value === '') delete state.program.swaps[t.dataset.k]; else state.program.swaps[t.dataset.k] = t.value; save(); render(); return; }
  });
  let typeTimer = null;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.draft && t.type !== 'checkbox') draft()[t.dataset.draft] = t.value;
    if (t.dataset.calc) { const [l, k] = t.dataset.calc.split(':'); const dr = draft(); dr.calc[l] = dr.calc[l] || {}; dr.calc[l][k] = t.value; }
    // Save set inputs as you type, so a closed app mid-entry loses nothing.
    if (t.dataset.set && state.current) { clearTimeout(typeTimer); const ei = Number(t.dataset.ei), si = Number(t.dataset.si), which = t.dataset.set, val = t.value; typeTimer = setTimeout(() => { if (state.current && state.current.exercises[ei]) setField(ei, si, which, val, true); }, 350); }
  });

  // ---------- Boot ----------
  async function boot() {
    const h = (location.hash || '').replace('#', '');
    if (['today', 'program', 'history', 'settings'].includes(h)) view = h;
    state = E.defaultState();
    $('#main').innerHTML = '<p class="empty">Loading…</p>';
    const loaded = await Store.init();
    if (loaded) state = Object.assign(E.defaultState(), loaded);
    if (state.current && state.current.phase === 'cardio') ui.cardioRun = null;
    migrate();
    render();
    if (state.current && state.current.phase === 'lift') { resumeTimer(); keepAwake(); }
  }
  // One-time upgrade steps for data saved by earlier versions.
  function migrate() {
    const s = state.settings;
    if (s.autoCalibrate == null) s.autoCalibrate = true;
    if (s.warmupSets == null) s.warmupSets = true;
    if (s.squatStyle == null) s.squatStyle = 'lowbar';
    if (!state.migratedV2) {
      // Run every already-logged session through the calibration it never had, oldest first.
      const lines = [];
      for (const sess of state.sessions) {
        if (sess.skipped || sess.calibrated) continue;
        const l = E.calibrate(state, sess); sess.calibrated = true;
        l.forEach(x => { addLog(x); lines.push(`${fmtDate(sess.date)}: ${x}`); });
      }
      if (state.sessions.some(x => !x.skipped)) lines.push(`Maxes now: squat ${state.lifts.squat.oneRM}, bench ${state.lifts.bench.oneRM}, deadlift ${state.lifts.deadlift.oneRM}. From here on they calibrate after every session.`);
      if (lines.length) state.lastReport = { title: 'Your logged sessions, re-read by the new calibration', lines };
      state.migratedV2 = true; save();
    }
  }
  boot();
})();

</script>
